<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Natiq Arab</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#F5B800;--gold-d:#C98A00;--gold-l:#FFF1C2;--bg:#FFFCF3;--card:#FFFFFF;--ink:#2A200E;--mut:#8C7B58;--line:#F1E7CC;--soft:#FBF5E4;
 --ok:#2EC45E;--ok-d:#1E9E48;--ok-l:#DDF8E6;--bad:#F04848;--bad-d:#C93030;--bad-l:#FFE2E2;--blue:#2F8CFF;--blue-d:#1D6FD6;--blue-l:#E2F0FF;--purple:#9B5CF6;--coral:#FF7A45;
 --lock:#E6E0D0;--lock-d:#CFC7B2;--nav:70px;--r:20px}
:root.dark{--bg:#13100A;--card:#201B11;--ink:#FFF5DA;--mut:#B6A57E;--line:#3A311D;--soft:#1A160D;--gold-l:#3B2F0E;--lock:#3A3324;--lock-d:#2A2416;--ok-l:#123A22;--bad-l:#3D1717;--blue-l:#13294A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:700}
body{min-height:100vh;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font:inherit}
.ar{font-family:"Noto Naskh Arabic","Geeza Pro","Traditional Arabic",serif;direction:rtl;unicode-bidi:isolate;font-weight:700;line-height:1.5}
.hide{display:none!important}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom))}
/* ----- stikerlar ----- */
.stk{display:inline-block;flex:none;overflow:visible;vertical-align:middle}
/* ----- maskot ----- */
.msc{display:block;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
#intro{position:fixed;inset:0;z-index:98;background:radial-gradient(circle at 50% 42%,#FFF3C4,var(--bg) 62%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .45s;overflow:hidden}
:root.dark #intro{background:radial-gradient(circle at 50% 42%,#3B300F,var(--bg) 62%)}
#intro.out{opacity:0;pointer-events:none}
#intro .stage{position:relative;width:250px;height:250px}
#intro .stage .msc{width:250px;height:250px;position:absolute;left:0;bottom:0}
#intro .shadow{position:absolute;left:50%;bottom:-8px;width:160px;height:20px;margin-left:-80px;border-radius:50%;background:rgba(80,50,0,.18);filter:blur(3px)}
#intro .hint{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));font-size:12.5px;color:var(--mut);font-weight:800}
.walkin{animation:walkIn 1.45s cubic-bezier(.25,.75,.35,1) both}
@keyframes walkIn{0%{transform:translateX(-115vw)}100%{transform:none}}
.stepb{animation:stepB .29s ease-in-out 5,hop .65s cubic-bezier(.3,1.7,.5,1) 1.5s 1}
@keyframes stepB{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-13px) rotate(4deg)}}
@keyframes hop{45%{transform:translateY(-30px) scale(1.05) rotate(-3deg)}}
.bubble{position:relative;margin-top:22px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px 20px;font-size:20px;font-weight:900;box-shadow:0 4px 0 var(--line);opacity:0;animation:bub .45s cubic-bezier(.2,1.6,.4,1) 1.45s both;max-width:320px;text-align:center}
.bubble::before{content:"";position:absolute;top:-11px;left:50%;margin-left:-10px;border:10px solid transparent;border-top:0;border-bottom-color:var(--line)}
@keyframes bub{0%{opacity:0;transform:scale(.5) translateY(12px)}100%{opacity:1;transform:none}}
.breath{animation:breath 2.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes breath{50%{transform:scale(1.03,.96)}}
.zz{position:absolute;right:18px;top:6px;font-weight:900;color:#1E6B45;font-size:26px;animation:zz 2.1s ease-in infinite;opacity:0}
@keyframes zz{0%{opacity:0;transform:translate(0,10px) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translate(30px,-46px) scale(1.25)}}
.wake{animation:wake .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes wake{0%{transform:scale(.7) rotate(-8deg);opacity:.2}100%{transform:none;opacity:1}}
#nap{position:fixed;right:6px;bottom:calc(var(--nav) + 6px + env(safe-area-inset-bottom));z-index:40;width:92px;height:92px;transition:transform .45s cubic-bezier(.2,1.4,.4,1);transform:translateY(170%)}
#nap.on{transform:none}
#nap .msc{width:92px;height:92px}
#nap .zz{right:4px;top:-4px;font-size:20px}
.fbm{width:70px;height:70px;margin-left:auto;margin-top:-18px;animation:pop .45s cubic-bezier(.2,1.6,.4,1) both;flex:none}
.hero .msc{width:176px;height:176px;position:relative;animation:heroIn .8s cubic-bezier(.2,1.6,.4,1) both,float 3s ease-in-out .8s infinite}
.peek{position:absolute;width:88px;height:88px;top:-14px}
.rkhead{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#FFE58A,#F5B800);border-radius:22px;padding:14px 16px;color:#3A2800;box-shadow:0 4px 0 var(--gold-d);margin:16px 0 4px;position:relative}
.rkhead h2{margin:0;font-size:24px;font-weight:900}.rkhead p{margin:2px 0 0;font-size:13.5px;opacity:.85}
.rkhead .msc{width:112px;height:112px;margin:-40px -8px -18px 0}
.pav{width:86px;height:86px;flex:none;border-radius:50%;background:radial-gradient(circle at 50% 38%,#FFF6CF,#FFD45C);border:3px solid #fff;box-shadow:0 0 0 2px var(--line),0 4px 10px rgba(0,0,0,.12);overflow:hidden;display:grid;place-items:center}
.pav .msc{width:100px;height:100px;margin-top:16px}
.mtip{display:flex;align-items:center;gap:10px;margin:10px 0 0}
.mtip .msc{width:92px;height:92px;flex:none}
.mtip .bb{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-weight:800;font-size:14.5px;position:relative;box-shadow:0 3px 0 var(--line)}
.mtip .bb::before{content:"";position:absolute;left:-10px;top:50%;margin-top:-8px;border:8px solid transparent;border-left:0;border-right-color:var(--line)}
/* ----- yuqori panel ----- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;gap:4px;padding:8px 12px;border-bottom:2px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden}
.brand .lg{width:32px;height:32px;border-radius:10px;background:linear-gradient(145deg,#FFE27A,var(--gold) 55%,var(--gold-d));display:grid;place-items:center;color:#fff;font-size:20px;box-shadow:0 2px 0 var(--gold-d),inset 0 2px 0 rgba(255,255,255,.5);flex:none}
.stat{display:flex;align-items:center;gap:2px;font-weight:900;font-size:15.5px;padding:2px 5px;border-radius:12px}
.stat .stk{width:30px;height:30px}
.s-heart{color:#E5333F}.s-coin{color:#C98A00}.s-apple{color:#E5333F}.s-tree{color:#1E9E48}
:root.dark .s-coin{color:var(--gold)}
.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.35)}}
/* ----- pastki menyu ----- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav)}
.nb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:800;color:var(--mut);position:relative}
.nb .stk{width:36px;height:36px;filter:grayscale(.75) opacity(.75);transition:transform .15s,filter .15s}
.nb.on{color:var(--gold-d)}:root.dark .nb.on{color:var(--gold)}
.nb.on .stk{filter:none;transform:scale(1.1) translateY(-1px)}
.nb.on::before{content:"";position:absolute;top:5px;width:58px;height:42px;border-radius:15px;background:var(--gold-l);z-index:-1;border:2px solid #F7D46B}
:root.dark .nb.on::before{border-color:#5A4813}
.wrap{padding:16px 16px 8px}
h2.tt{font-size:24px;font-weight:900;margin:4px 0 2px}
.sub{color:var(--mut);font-size:14px;margin:0 0 14px}
/* ----- tugmalar ----- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:16px;font-weight:900;font-size:16px;letter-spacing:.4px;text-transform:uppercase;
 background:var(--gold);color:#3A2800;box-shadow:0 4px 0 var(--gold-d);transition:transform .06s,box-shadow .06s;padding:0 16px}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--gold-d)}
.btn.ok{background:var(--ok);color:#fff;box-shadow:0 4px 0 var(--ok-d)}.btn.bad{background:var(--bad);color:#fff;box-shadow:0 4px 0 var(--bad-d)}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-d)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn:disabled,.btn.off{background:var(--lock);color:var(--mut);box-shadow:0 4px 0 var(--lock-d);pointer-events:none}
.btn.sm{min-height:40px;font-size:13.5px;border-radius:13px;width:auto;padding:0 14px}
.btn .stk{width:24px;height:24px}
.lnk{color:var(--blue-d);font-weight:900;text-transform:uppercase;font-size:14px;letter-spacing:.4px;padding:10px;display:block;margin:6px auto 0}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 3px 0 var(--line)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--mut)}
/* ----- darslar yoʻli ----- */
.unit{border-radius:22px;padding:16px 18px;color:#fff;display:flex;align-items:center;gap:12px;margin:18px 0 8px;position:relative;overflow:hidden;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.unit::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 20%,rgba(255,255,255,.35),transparent 45%),repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 10px,transparent 10px 20px);pointer-events:none}
.unit .k{font-size:12.5px;font-weight:900;opacity:.92;text-transform:uppercase;letter-spacing:.6px}
.unit h3{margin:2px 0 6px;font-size:21px;font-weight:900}
.unit .bar{height:9px;border-radius:9px;background:rgba(0,0,0,.18);overflow:hidden;max-width:180px}
.unit .bar i{display:block;height:100%;background:#fff;border-radius:9px}
.unit .big{font-size:62px;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.12),0 5px 0 rgba(0,0,0,.12),0 8px 14px rgba(0,0,0,.2);min-width:64px;text-align:center}
.path{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;padding:12px 0 6px}
.node{width:78px;height:72px;border-radius:50%;display:grid;place-items:center;position:relative;background:var(--gold);box-shadow:0 7px 0 var(--gold-d),inset 0 -4px 0 rgba(0,0,0,.08),inset 0 4px 0 rgba(255,255,255,.35);color:#fff;transition:transform .08s}
.node:active{transform:translateY(5px)}
.node svg{width:34px;height:34px}
.node.lock{background:var(--lock);box-shadow:0 7px 0 var(--lock-d);color:#B3A98F}
:root.dark .node.lock{color:#6F6650}
.node.empty{background:var(--soft);box-shadow:0 7px 0 var(--lock-d);color:var(--mut);border:3px dashed var(--lock-d)}
.node .ring{position:absolute;inset:-10px;border-radius:50%;border:5px solid var(--gold-l)}
.tip{position:absolute;bottom:calc(100% + 14px);left:50%;transform:translateX(-50%);background:var(--card);border:2px solid var(--line);border-radius:13px;padding:7px 12px;
 font-weight:900;font-size:13px;white-space:nowrap;animation:bob 1.4s ease-in-out infinite;text-transform:uppercase;letter-spacing:.5px}
.tip::after{content:"";position:absolute;top:100%;left:50%;margin-left:-8px;border:8px solid transparent;border-top-color:var(--line)}
@keyframes bob{50%{transform:translate(-50%,-6px)}}
.nlab{font-size:12px;color:var(--mut);margin-top:-6px;font-weight:800}
.nwrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.nwrap.cw{margin-top:34px}
.alert{display:flex;align-items:center;gap:12px;background:var(--bad-l);border:2px solid #FFC4C4;border-radius:18px;padding:12px 14px;margin:6px 0 4px;width:100%;text-align:left}
:root.dark .alert{border-color:#5C2323}
.alert.gold{background:var(--gold-l);border-color:#F7D46B}:root.dark .alert.gold{border-color:#5A4813}
.alert .stk{width:40px;height:40px}
/* ----- pastdan chiquvchi oyna ----- */
.scrim{position:fixed;inset:0;background:rgba(20,14,0,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.9,.3,1)}
.sheet.on{transform:none}
.sheet:not(.on){visibility:hidden;transition:transform .26s,visibility 0s .26s}
.sheet .in{max-width:560px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:4px 0 6px;font-size:21px;font-weight:900}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:4px 11px 4px 6px;font-size:13px;font-weight:900;background:var(--soft);border:2px solid var(--line)}
.pill .stk{width:22px;height:22px}
/* ----- dars oynasi ----- */
#ov{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column}
#ov .head{display:flex;align-items:center;gap:12px;padding:14px 16px 8px;max-width:620px;width:100%;margin:0 auto}
.x{width:36px;height:36px;display:grid;place-items:center;color:var(--mut)}
.x svg{width:26px;height:26px}
.prog{flex:1;height:16px;border-radius:12px;background:var(--lock);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(var(--ok),var(--ok-d));border-radius:12px;transition:width .35s;position:relative}
.prog i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:4px;background:rgba(255,255,255,.4)}
.hearts{display:flex;align-items:center;gap:2px;color:#E5333F;font-weight:900;font-size:18px}
.hearts .stk{width:32px;height:32px}
.hearts.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
#ov .body{flex:1;overflow:auto;padding:8px 18px 20px;max-width:620px;width:100%;margin:0 auto}
#ov .foot{border-top:2px solid var(--line);padding:16px 18px calc(16px + env(safe-area-inset-bottom));transition:background .2s}
#ov .foot .in{max-width:620px;margin:0 auto}
#ov .foot.good{background:var(--ok-l);border-color:transparent}
#ov .foot.wrong{background:var(--bad-l);border-color:transparent}
.fb{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-weight:900;font-size:20px}
.fb .ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#fff;flex:none;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.fb .ic svg{width:28px;height:28px}
.good .fb{color:var(--ok-d)}.wrong .fb{color:var(--bad-d)}
.fb small{display:block;font-size:15px;font-weight:800;margin-top:2px}
.kind{font-size:12.5px;font-weight:900;text-transform:uppercase;letter-spacing:.7px;color:var(--purple);display:flex;align-items:center;gap:6px;margin-top:6px}
.kind i{width:8px;height:8px;border-radius:50%;background:currentColor}
.qh{font-size:22px;font-weight:900;margin:6px 0 14px;line-height:1.3}
.qar{display:flex;align-items:center;justify-content:center;gap:12px;margin:6px 0 18px;flex-wrap:wrap}
.qar .ar{font-size:62px;line-height:1.3}
.spk{width:60px;height:60px;border-radius:18px;background:linear-gradient(#48A0FF,var(--blue));color:#fff;display:grid;place-items:center;box-shadow:0 4px 0 var(--blue-d),inset 0 2px 0 rgba(255,255,255,.3);flex:none}
.spk:active{transform:translateY(4px);box-shadow:none}
.spk svg{width:30px;height:30px}
.spk.big{width:116px;height:116px;border-radius:30px}.spk.big svg{width:58px;height:58px}
.spk.slow{width:56px;height:56px;background:linear-gradient(#7CC4FF,#52A8FF);box-shadow:0 4px 0 #3A86D6}
.spk.slow svg{width:30px;height:30px}
.opts{display:grid;gap:10px}
.opts.g2{grid-template-columns:1fr 1fr}
.op{min-height:58px;border-radius:16px;border:2px solid var(--line);background:var(--card);box-shadow:0 4px 0 var(--line);padding:10px 14px;font-size:17px;font-weight:800;text-align:left;display:flex;align-items:center;gap:12px;transition:transform .05s}
.op .n{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:var(--mut);flex:none}
.op.ar{justify-content:center;font-size:34px;min-height:84px;text-align:center}
.op.img{flex-direction:column;padding:8px;gap:6px;text-align:center;justify-content:flex-start}
.op.img img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--soft)}
.op.tf{justify-content:center;font-size:19px;min-height:90px;flex-direction:column;gap:4px}
.op.tf svg{width:34px;height:34px}
.op.sel{border-color:#86C3FF;background:var(--blue-l);box-shadow:0 4px 0 #86C3FF;color:var(--blue-d)}
.op.right{border-color:#7FDB9C;background:var(--ok-l);box-shadow:0 4px 0 #7FDB9C;color:var(--ok-d)}
.op.wrongc{border-color:#FF9F9F;background:var(--bad-l);box-shadow:0 4px 0 #FF9F9F;color:var(--bad-d)}
.op:active{transform:translateY(3px)}
.qimg{display:block;max-width:100%;max-height:220px;border-radius:16px;margin:0 auto 14px;border:2px solid var(--line)}
/* soʻz plitkalari (jumla tuzish, harflardan soʻz) */
.ans{min-height:122px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);background:repeating-linear-gradient(transparent 0 58px,var(--line) 58px 60px);display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;padding:8px 2px;margin:8px 0 20px}
.ans.rtl{direction:rtl}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.bank.rtl{direction:rtl}
.tile{min-height:48px;padding:6px 15px;border-radius:14px;border:2px solid var(--line);background:var(--card);box-shadow:0 3px 0 var(--line);font-size:18px;font-weight:800;transition:transform .08s}
.tile.ar{font-size:28px;padding:0 15px;line-height:1.5}
.tile.ghost{background:var(--lock);border-color:var(--lock);box-shadow:none;color:transparent;pointer-events:none}
.tile:active{transform:translateY(3px)}
.tile.ok{border-color:#7FDB9C;color:var(--ok-d);background:var(--ok-l)}.tile.no{border-color:#FF9F9F;color:var(--bad-d);background:var(--bad-l)}
.word{text-align:center;font-size:58px;min-height:92px;color:var(--ink)}
.word.empty{color:var(--lock-d)}
/* juftini topish */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.mcol{display:grid;gap:10px;align-content:start}
.mi{min-height:60px;border-radius:16px;border:2px solid var(--line);background:var(--card);box-shadow:0 4px 0 var(--line);font-size:17px;font-weight:800;padding:8px 10px;position:relative}
.mi.ar{font-size:28px}
.mi.sel{border-color:#86C3FF;background:var(--blue-l);box-shadow:0 4px 0 #86C3FF}
.mi[data-c]{color:#fff;border-color:transparent}
.mi.ok{background:var(--ok-l)!important;border-color:#7FDB9C!important;color:var(--ok-d)!important;box-shadow:0 4px 0 #7FDB9C}
.mi.no{background:var(--bad-l)!important;border-color:#FF9F9F!important;color:var(--bad-d)!important;box-shadow:0 4px 0 #FF9F9F}
/* yozish */
.inpbox{width:100%;min-height:120px;border-radius:18px;border:2px solid var(--line);background:var(--soft);padding:14px;font-size:20px;font-weight:800;color:var(--ink);resize:none}
.inpbox:focus{outline:none;border-color:var(--blue)}
.inpbox.rtl{direction:rtl;font-family:"Noto Naskh Arabic",serif;font-size:28px}
.kb{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:12px;direction:rtl}
.kb button{min-height:44px;border-radius:11px;background:var(--card);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-size:22px}
.kb button.w2{grid-column:span 2;font-family:Nunito;font-size:14px;font-weight:900}
/* gapirish */
.mic{width:128px;height:128px;border-radius:50%;margin:18px auto 8px;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#FF8A8A,#F04848 55%,#C21E2A);box-shadow:0 7px 0 #A0141E,inset 0 3px 0 rgba(255,255,255,.35);color:#fff}
.mic svg{width:56px;height:56px}
.mic.rec{animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 7px 0 #A0141E,0 0 0 0 rgba(240,72,72,.5)}100%{box-shadow:0 7px 0 #A0141E,0 0 0 28px rgba(240,72,72,0)}}
.bigcard{border-radius:28px;background:linear-gradient(160deg,#FFF6D6,#FFE7A0);border:3px solid #F7D46B;box-shadow:0 6px 0 #E9BF45;padding:24px 18px 20px;text-align:center;margin:8px 0 18px;color:#3A2800}
:root.dark .bigcard{background:linear-gradient(160deg,#3B300F,#2A220C);border-color:#6B5414;box-shadow:0 6px 0 #4B3B0E;color:var(--ink)}
.bigcard .ar{font-size:104px;line-height:1.25}
.bigcard .tr{font-size:26px;font-weight:900;margin-top:2px}
.bigcard .mn{font-size:17px;color:#8A6A10;margin-top:4px}
:root.dark .bigcard .mn{color:var(--mut)}
.lst{font-size:13px;color:var(--mut);margin-top:12px}
.rule{font-size:17px;line-height:1.6;font-weight:700}
.rule p{margin:0 0 12px}
.rule .ar{font-size:30px}
.vid{width:100%;aspect-ratio:16/9;border-radius:18px;background:#000;border:0;display:block}
.words{display:grid;gap:10px}
.wd{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 var(--line)}
.wd .ar{font-size:34px;min-width:84px;text-align:center}
.wd .spk{width:46px;height:46px;border-radius:14px}.wd .spk svg{width:22px;height:22px}
/* ----- natija va bayram ----- */
.res{text-align:center;padding:22px 6px;position:relative;z-index:2}
.res h2{font-size:30px;font-weight:900;margin:10px 0 6px}
.res .chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.rc{border-radius:16px;border:2px solid var(--line);min-width:100px;overflow:hidden;background:var(--card);animation:pop .5s both}
.rc b{display:block;padding:6px 10px;font-size:12px;color:#fff;text-transform:uppercase;letter-spacing:.4px}
.rc span{display:flex;align-items:center;justify-content:center;gap:4px;padding:10px;font-size:22px;font-weight:900}
.rc .stk{width:30px;height:30px}
.hero{width:150px;height:150px;margin:0 auto;position:relative;display:grid;place-items:center}
.hero .stk{width:130px;height:130px;animation:heroIn .8s cubic-bezier(.2,1.6,.4,1) both,float 3s ease-in-out .8s infinite}
.hero::before{content:"";position:absolute;inset:-40px;background:repeating-conic-gradient(rgba(255,200,40,.28) 0 10deg,transparent 10deg 24deg);border-radius:50%;animation:spin 14s linear infinite;-webkit-mask:radial-gradient(circle,#000 35%,transparent 70%);mask:radial-gradient(circle,#000 35%,transparent 70%)}
@keyframes heroIn{0%{transform:scale(0) rotate(-30deg)}100%{transform:none}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.fx{position:fixed;inset:0;pointer-events:none;z-index:85;overflow:hidden}
.cf{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
.cn{position:absolute;left:50%;top:38%;width:38px;height:38px;animation:burst 1.3s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}70%{opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1) rotate(var(--r));opacity:0}}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:none;opacity:1}}
/* ----- daraxt kinosi (3D harakatli animatsiya) ----- */
#cine{position:fixed;inset:0;z-index:95;background:#8FD3FF;overflow:hidden}
#cine svg.sc{position:absolute;inset:0;width:100%;height:100%}
#cine .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 18px calc(20px + env(safe-area-inset-bottom));color:#fff;background:linear-gradient(transparent,rgba(20,40,10,.6) 35%)}
#cine .caprow{display:flex;align-items:center;gap:10px;max-width:440px;margin:0 auto 12px;text-align:left}
#cine .caprow .msc{width:84px;height:84px;flex:none}
#cine .cap h2{font-size:26px;font-weight:900;margin:0 0 4px;text-shadow:0 3px 0 rgba(0,0,0,.25);opacity:0;animation:capIn .6s both}
#cine .cap p{margin:0 0 16px;font-size:16px;opacity:0;animation:capIn .6s both}
#cine .cap .btn{opacity:0;animation:capIn .5s both;max-width:420px;margin:0 auto}
#cine .skip{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;background:rgba(0,0,0,.28);color:#fff;border-radius:99px;padding:8px 14px;font-weight:900;font-size:13px;z-index:3}
#cine video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
@keyframes capIn{0%{opacity:0;transform:translateY(20px)}100%{opacity:1;transform:none}}
.cam{animation:cam var(--dur) cubic-bezier(.45,0,.2,1) both;transform-box:view-box;transform-origin:200px var(--by,465px)}
@keyframes cam{0%{transform:scale(1.6) translateY(40px)}100%{transform:scale(1) translateY(0)}}
.par1{animation:par1 var(--dur) ease-out both}.par2{animation:par2 var(--dur) ease-out both}.par3{animation:par3 var(--dur) ease-out both}
@keyframes par1{0%{transform:translateX(-30px)}100%{transform:none}}
@keyframes par2{0%{transform:translateX(-60px)}100%{transform:none}}
@keyframes par3{0%{transform:translateX(50px)}100%{transform:none}}
.stg{transform-box:fill-box;transform-origin:50% 100%;opacity:0}
@keyframes stIn{0%{opacity:0;transform:scale(.2,.05)}55%{opacity:1;transform:scale(1.08,1.12)}100%{opacity:1;transform:none}}
@keyframes stOut{to{opacity:0;transform:scale(1.05)}}
.apl{transform-box:fill-box;transform-origin:50% 0;opacity:0}
@keyframes aplIn{0%{opacity:0;transform:scale(0)}60%{opacity:1;transform:scale(1.35)}100%{opacity:1;transform:scale(1)}}
.spark{transform-box:fill-box;transform-origin:center;opacity:0;animation:twk 1.4s ease-in-out infinite}
@keyframes twk{0%,100%{opacity:0;transform:scale(.2)}50%{opacity:1;transform:scale(1)}}
.rays{transform-box:view-box;transform-origin:200px 170px;animation:spin 30s linear infinite}
.drift{animation:drift 40s linear infinite}
@keyframes drift{0%{transform:translateX(-40px)}100%{transform:translateX(60px)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.3deg)}50%{transform:rotate(1.3deg)}}
.leaf{animation:leafF 6s linear infinite;opacity:0}
@keyframes leafF{0%{opacity:0;transform:translate(0,0) rotate(0)}10%{opacity:1}100%{opacity:0;transform:translate(60px,180px) rotate(300deg)}}
/* ----- reyting ----- */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;margin:18px 0 18px}
.pd{text-align:center}
.pd .av{margin:0 auto 6px}
.pd .nm{font-size:13.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pd .sc{display:inline-flex;align-items:center;gap:2px;font-size:13.5px;color:var(--gold-d);font-weight:900}
:root.dark .pd .sc{color:var(--gold)}
.pd .sc .stk{width:20px;height:20px}
.pd .base{border-radius:14px 14px 4px 4px;margin-top:8px;display:grid;place-items:center;color:#fff;font-size:30px;font-weight:900;box-shadow:inset 0 -8px 0 rgba(0,0,0,.12),inset 0 4px 0 rgba(255,255,255,.3);text-shadow:0 2px 0 rgba(0,0,0,.2)}
.av{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:20px;position:relative;flex:none;border:3px solid #fff;box-shadow:0 0 0 2px var(--line),0 3px 6px rgba(0,0,0,.12)}
.av.lg{width:70px;height:70px;font-size:26px}
.av .crown{position:absolute;top:-26px;left:50%;transform:translateX(-50%) rotate(-8deg);width:40px;height:40px}
.rl{display:flex;flex-direction:column;gap:8px}
.rr{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:9px 12px}
.rr .rk{width:26px;text-align:center;font-weight:900;color:var(--mut)}
.rr .av{width:40px;height:40px;font-size:16px;border-width:2px}
.rr .nm{flex:1;min-width:0;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr .sc{display:flex;align-items:center;gap:2px;font-weight:900}
.rr .sc .stk{width:26px;height:26px}
.rr.me{background:var(--gold-l);border-color:#F7D46B}
:root.dark .rr.me{border-color:#5A4813}
.mine{position:sticky;bottom:calc(var(--nav) + 10px + env(safe-area-inset-bottom));margin-top:12px;box-shadow:0 4px 0 #EFC649,0 8px 22px rgba(120,80,0,.18)}
/* ----- bogʻ (dala) ----- */
.gstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.gs{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:8px 6px;text-align:center;box-shadow:0 3px 0 var(--line)}
.gs b{display:flex;align-items:center;justify-content:center;gap:2px;font-size:22px;font-weight:900}
.gs .stk{width:36px;height:36px}
.gs span{font-size:12px;color:var(--mut)}
.field{margin:0 -16px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;border-top:3px solid #fff;border-bottom:3px solid #fff;box-shadow:0 4px 0 var(--line)}
.field::-webkit-scrollbar{display:none}
.field svg{display:block;height:330px}
.tr-hit{cursor:pointer}
.tr-hit:active{opacity:.8}
.fhint{font-size:12.5px;color:var(--mut);text-align:center;margin:8px 0 12px}
.thirst{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;margin-bottom:12px}
.th{flex:none;width:118px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px;text-align:center}
.th .ar{font-size:30px;line-height:1.2}
.th .btn{min-height:36px;font-size:12px;border-radius:11px;margin-top:6px;padding:0 6px}
.empty{text-align:center;padding:24px 16px;color:var(--mut)}
.empty .stk{width:96px;height:96px}
/* ----- profil ----- */
.phead{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.code{font-family:ui-monospace,Menlo,monospace;letter-spacing:2px;background:var(--soft);border:2px solid var(--line);border-radius:9px;padding:2px 8px;font-size:13px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.sg{border:2px solid var(--line);border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:8px;background:var(--card);box-shadow:0 3px 0 var(--line)}
.sg .stk{width:44px;height:44px}
.sg b{display:block;font-size:21px;font-weight:900;line-height:1.1}
.sg span{font-size:12.5px;color:var(--mut)}
.list{background:var(--card);border:2px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:14px;box-shadow:0 3px 0 var(--line)}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:2px solid var(--line);width:100%;text-align:left}
.li:first-child{border-top:0}
.li .stk{width:42px;height:42px}
.li .t{flex:1;min-width:0}
.li .t small{display:block;color:var(--mut);font-size:12.5px;font-weight:700}
.chev{width:20px;height:20px;color:var(--mut)}
.help{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border-radius:var(--r);padding:14px 16px;margin-bottom:14px;color:#fff;background:linear-gradient(135deg,#18B37E,#0E8F80);box-shadow:0 4px 0 #0B6E63}
.help .stk{width:56px;height:56px}
.help b{font-size:18px;display:block}
.help small{font-size:13px;opacity:.92}
.seg{display:flex;background:var(--soft);border:2px solid var(--line);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px 8px;border-radius:10px;font-size:13px;font-weight:900;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 0 var(--line)}
.tg{width:52px;height:30px;border-radius:99px;background:var(--lock);position:relative;transition:background .2s;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tg.on{background:var(--ok)}.tg.on::after{transform:translateX(22px)}
.live{border-radius:var(--r);padding:16px;color:#fff;background:linear-gradient(135deg,#2F8CFF,#7B5CFF);box-shadow:0 4px 0 #3C4FC9;margin-bottom:14px}
.live h4{margin:0 0 4px;font-size:18px;font-weight:900}
.live .stk{width:54px;height:54px}
.live .btn{background:#fff;color:#2D47C7;box-shadow:0 4px 0 #C9D3FF;margin-top:12px}
/* ----- market ----- */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prod{background:var(--card);border:2px solid var(--line);border-radius:18px;overflow:hidden;text-align:left;box-shadow:0 3px 0 var(--line)}
.prod .im{aspect-ratio:1;background:var(--soft) center/cover no-repeat;display:grid;place-items:center}
.prod .im .stk{width:72px;height:72px}
.prod .pi{padding:10px 12px}
.prod .pn{font-weight:900;font-size:14.5px;line-height:1.25;min-height:36px}
.price{display:inline-flex;align-items:center;gap:2px;font-weight:900;color:var(--gold-d);font-size:16px}
:root.dark .price{color:var(--gold)}
.price .stk{width:24px;height:24px}
.inp{width:100%;min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--soft);padding:0 14px;font-size:17px;font-weight:800;color:var(--ink)}
.inp:focus{outline:none;border-color:var(--gold)}
.back{display:flex;align-items:center;gap:6px;font-weight:900;color:var(--mut);margin-bottom:8px}
.back svg{width:22px;height:22px}
.ord{display:flex;align-items:center;gap:10px;padding:12px;border-top:2px solid var(--line)}
.ord:first-child{border-top:0}
.st{font-size:12px;font-weight:900;border-radius:99px;padding:3px 9px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 24px);transform:translateX(-50%) translateY(20px);background:#2A200E;color:#fff;border-radius:14px;padding:12px 16px;font-weight:800;z-index:99;opacity:0;transition:.25s;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.center{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.spin{width:44px;height:44px;border-radius:50%;border:5px solid var(--gold-l);border-top-color:var(--gold);animation:spin .8s linear infinite}
@media (max-width:370px){.stat{font-size:13.5px;padding:2px 2px}.stat .stk{width:25px;height:25px}.brand span{display:none}}
@media (prefers-reduced-motion:reduce){.sway,.drift,.rays,.spark,.leaf{animation:none!important}}
/* kurslar, qidiruv, profil, obuna, dinor sotib olish */
.crs{display:flex;align-items:center;gap:12px;margin:22px 0 6px;padding:12px 14px;border-radius:20px;background:var(--card);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.crs .k{font-size:12px;font-weight:900;color:var(--gold-d);text-transform:uppercase;letter-spacing:.6px}
.crs h3{margin:1px 0 6px;font-size:20px;font-weight:900}
.crs .bar{height:8px;border-radius:8px;background:var(--soft);overflow:hidden;max-width:200px}.crs .bar i{display:block;height:100%;background:var(--gold);border-radius:8px}
.crs small{font-size:12px;color:var(--mut);font-weight:800}
.crs .ci{width:46px;height:46px;flex:none;display:grid;place-items:center;color:var(--mut)}.crs .ci .stk,.crs .ci svg{width:44px;height:44px}
.crs.off{opacity:.85}.crs.off h3{color:var(--mut)}

.crslock b{font-size:15.5px}.crslock p{margin:3px 0 8px;font-size:13px;color:var(--mut)}
.srch{position:relative;margin:12px 0 4px}.srch svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--mut)}
.srch .inp{padding-left:42px;margin:0}
button.rr{width:100%;text-align:left}button.pd{display:block;width:100%;min-width:0}
.rr .nm small.fl{display:block;font-size:11.5px;color:var(--gold-d);font-weight:800}
.av.xl{width:78px;height:78px;font-size:30px;margin:0}
.soc{display:flex;gap:8px;margin-top:8px}.soc button{flex:1;background:var(--soft);border:2px solid var(--line);border-radius:14px;padding:6px 8px;text-align:center}
.soc b{display:block;font-size:18px;font-weight:900;line-height:1.1}.soc span{font-size:12px;color:var(--mut);font-weight:800}
h3.sec{display:flex;align-items:center;gap:6px;font-size:17px;font-weight:900;margin:6px 0 10px}h3.sec .stk{width:30px;height:30px}
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.plan{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 8px;text-align:center;box-shadow:0 4px 0 var(--line)}
.plan .stk{width:46px;height:46px;margin:0 auto}.plan b{display:block;font-size:22px;font-weight:900}.plan span{font-size:13px;color:var(--mut);font-weight:800}
.plan.on{border-color:var(--gold);background:var(--gold-l);box-shadow:0 4px 0 var(--gold-d)}
.paybox{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:0 3px 0 var(--line);display:grid;gap:14px}
.pst{display:flex;gap:10px}.pst>span{width:28px;height:28px;flex:none;border-radius:50%;background:var(--gold);color:#3A2800;display:grid;place-items:center;font-weight:900}
.cardno{margin:8px 0 4px;font-size:21px;font-weight:900;letter-spacing:1.5px;background:var(--soft);border:2px dashed var(--line);border-radius:12px;padding:8px 10px;cursor:pointer;overflow-wrap:anywhere}
.cardno small{font-size:11px;letter-spacing:0;color:var(--gold-d);text-transform:uppercase}
.chk{display:block;max-width:100%;max-height:260px;border-radius:12px;border:2px solid var(--line);margin-top:10px}
.btn[disabled]{opacity:.55;pointer-events:none}
</style>

let AC=null;
function ac(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}return AC;}
function tone(f,t0,d,o={}){const a=ac();if(!a)return;const t=a.currentTime+t0,os=a.createOscillator(),g=a.createGain();os.type=o.type||'sine';os.frequency.setValueAtTime(f,t);if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+d);
 const v=o.vol==null?.16:o.vol;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(o.att||.015));g.gain.exponentialRampToValueAtTime(.0001,t+d);os.connect(g);g.connect(o.dest||a.destination);os.start(t);os.stop(t+d+.05);}
function bell(f,t0,d=1.2,v=.12){tone(f,t0,d,{vol:v,att:.005});tone(f*2.01,t0,d*.6,{vol:v*.35,att:.005});tone(f*3.02,t0,d*.35,{vol:v*.15,att:.005,type:'triangle'});}
function noise(t0,d,f1,f2,v=.12){const a=ac();if(!a)return;const t=a.currentTime+t0,b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;
 const s=a.createBufferSource(),bp=a.createBiquadFilter(),g=a.createGain();s.buffer=b;bp.type='bandpass';bp.Q.value=1.2;bp.frequency.setValueAtTime(f1,t);bp.frequency.exponentialRampToValueAtTime(f2,t+d);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+d*.3);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(bp);bp.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d);}
function pad(notes,t0,d,v=.05){const a=ac();if(!a)return;const t=a.currentTime+t0,lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(400,t);lp.frequency.exponentialRampToValueAtTime(3200,t+d*.7);lp.connect(a.destination);
 notes.forEach((f,i)=>{[0,4].forEach(dt=>{const os=a.createOscillator(),g=a.createGain();os.type='sawtooth';os.frequency.value=f;os.detune.value=dt*(i%2?1:-1);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+d*.35);g.gain.setValueAtTime(v,t+d*.75);g.gain.exponentialRampToValueAtTime(.0001,t+d);os.connect(g);g.connect(lp);os.start(t);os.stop(t+d+.1);});});}

 ok(){tone(660,0,.14,{vol:.14});tone(990,.09,.22,{vol:.14});},

};

let AUD=null;const SAYS=[];
const sayBtn=(text,url,cls,slow)=>{SAYS.push([text,url]);return `<button class="spk ${cls||''}" onclick="sayI(${SAYS.length-1},${slow?1:0})" aria-label="${T('Tinglang')}">${slow?IC.turtle:IC.vol}</button>`;};
function sayI(i,slow){const s=SAYS[i];if(s)speak(s[0],s[1],slow);}
function speak(text,url,slow){try{if(AUD){AUD.pause();AUD=null;}if(window.speechSynthesis)speechSynthesis.cancel();}catch(e){}
 if(url&&url.indexOf('|')>0){playSeq(url.split('|'),slow,text);return;}
 if(url){AUD=new Audio(url);AUD.playbackRate=slow?.7:1;AUD.play().catch(()=>sayTTS(text,slow));return;}sayTTS(text,slow);}
function playSeq(urls,slow,text){let i=0;const next=()=>{if(i>=urls.length)return;const a=new Audio(urls[i++]);AUD=a;a.playbackRate=slow?.7:1;a.onended=()=>{if(AUD===a)setTimeout(next,slow?260:140);};a.play().catch(()=>{AUD=null;sayTTS(text,slow);});};next();}
function sayTTS(text,slow){if(!text||!window.speechSynthesis){toast('🔇 '+T('Tinglang'));return;}
 const u=new SpeechSynthesisUtterance(text);u.lang='ar-SA';u.rate=slow?.45:.8;const v=speechSynthesis.getVoices().find(v=>/^ar/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u);}

 l.innerHTML=it.left.map((t,i)=>{const p=MP[i];const st=res?(res[i]===p?'ok':'no'):'';return `<button class="mi ${isAr(t)?'ar':''} ${MSEL===i?'sel':''} ${st}" ${p>=0&&!res?`data-c style="background:${MCOL[i%MCOL.length]};box-shadow:0 4px 0 rgba(0,0,0,.2)"`:''} onclick="mL(${i})">${esc(t)}</button>`;}).join('');
 r.innerHTML=it.right.map((t,j)=>{const i=MP.indexOf(j);const st=res&&i>=0?(res[i]===j?'ok':'no'):'';return `<button class="mi ${isAr(t)?'ar':''} ${st}" ${i>=0&&!res?`data-c style="background:${MCOL[i%MCOL.length]};box-shadow:0 4px 0 rgba(0,0,0,.2)"`:''} onclick="mR(${j})">${esc(t)}</button>`;}).join('');
 const g=$('go');if(g&&!res)g.disabled=MP.some(x=>x<0);}
function mL(i){if(LOCK)return;if(MP[i]>=0&&MSEL!==i){MP[i]=-1;MSEL=i;}else MSEL=MSEL===i?null:i;sfx('tap');hap('light');drawMatch();}
function mR(j){if(LOCK)return;const was=MP.indexOf(j);if(MSEL==null){if(was>=0){MP[was]=-1;drawMatch();}return;}if(was>=0)MP[was]=-1;MP[MSEL]=j;MSEL=null;sfx('pop',0,500);hap('light');drawMatch();}

/* gapirish: yozib olish va oʻzini tinglash */
function recStop(){try{if(REC&&REC.on)REC.mr.stop();if(REC&&REC.st)REC.st.getTracks().forEach(t=>t.stop());}catch(e){}}
async function recToggle(){if(LOCK)return;if(REC&&REC.on){REC.mr.stop();return;}ac();
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true});const mr=new MediaRecorder(st);const ch=[];
  mr.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data);};
  mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());if(!REC||REC.mr!==mr)return;REC.on=false;REC.url=URL.createObjectURL(new Blob(ch,{type:mr.mimeType||'audio/webm'}));updMic();const g=$('go');if(g)g.disabled=false;};
  REC={mr,st,on:true};mr.start();updMic();hap('medium');setTimeout(()=>{if(REC&&REC.on&&REC.mr===mr)mr.stop();},8000);}
 catch(e){REC={fail:true};updMic();const g=$('go');if(g)g.disabled=false;}}
function updMic(){const m=$('mic'),l=$('micL'),p=$('micP');if(!m)return;m.classList.toggle('rec',!!(REC&&REC.on));m.innerHTML=REC&&REC.on?IC.stop:IC.mic;
 l.textContent=REC&&REC.on?T('Yozilmoqda… toʻxtatish uchun bosing'):REC&&REC.fail?T('Mikrofon ochilmadi')+' — '+T('Aytdim')+'?':T('Bosing va gapiring');
 p.innerHTML=REC&&REC.url?`<button class="btn ghost sm" style="margin:0 auto" onclick="new Audio('${REC.url}').play()">${IC.play.replace('<svg','<svg width="18" height="18"')} ${T('Oʻzimni tinglash')}</button>`:'';cyrDom(p);cyrDom(l.parentNode);}
function skipIt(){if(LOCK)return;LOCK=true;send({skip:true});}
async function check(){if(LOCK)return;const it=SESS.items[SESS.i];let b;
 if(it.type==='type'){const v=$('tx').value.trim();if(!v)return;b={text:v};}
 else if(it.type==='build'||it.type==='spell'){if(!PICK.length)return;b={tiles:PICK.slice()};}
 else if(it.type==='match'){if(MP.some(x=>x<0))return;b={pairs:MP.slice()};}
 else if(it.type==='speak'){recStop();b={self:true};}
 else{if(SEL==null)return;b={choice:SEL};}
 LOCK=true;$('go').disabled=true;await send(b);}
/* video/qoida/karta: javob tekshirilmaydi — keyingisiga darhol oʻtamiz, soʻrov fonda navbat bilan ketadi */
let QUEUE=Promise.resolve();
async function answer(){if(LOCK)return;const s=SESS;const g=$('go');if(g)g.disabled=true;
 if(s.i>=s.n-1){LOCK=true;await send({});return;}
 const i=s.i,sid=s.sid;
 QUEUE=QUEUE.then(()=>api('step',{sid,i})).then(r=>{if(SESS!==s)return;if(r.code==='sync'){if(r.i!==s.i){s.i=r.i;drawItem();}return;}ME.prog.hearts=r.hearts;s.gain=r.gain;})
  .catch(e=>{toast(e.message);if(e.code==='no_sess'){closeOv();refresh();}});
 s.i++;drawItem();}
async function send(extra){const s=SESS;let r;
 try{await QUEUE;if(SESS!==s)return;r=await api('step',Object.assign({sid:s.sid,i:s.i},extra));}catch(e){LOCK=false;const g=$('go');if(g)g.disabled=false;toast(e.message);if(e.code==='no_sess'){closeOv();refresh();}return;}
 if(r.code==='sync'){s.i=r.i;drawItem();return;}
 ME.prog.hearts=r.hearts;s.gain=r.gain;LAST=r;const it=s.items[s.i];
 if(it.t!=='q'||r.skip){next();return;}
 if(r.correct){s.ok++;sfx('ok');hap('ok');}else{sfx('bad');hap('err');const h=$('hrt');if(h){h.querySelector('span').textContent=r.hearts;h.classList.remove('shake');void h.offsetWidth;h.classList.add('shake');}}
 let shown='';
 if(['choice','listen','image','truefalse'].includes(it.type)){document.querySelectorAll('#opts .op').forEach(b=>{const i=+b.dataset.i;b.classList.remove('sel');if(i===r.answer)b.classList.add('right');else if(i===SEL&&!r.correct)b.classList.add('wrongc');b.disabled=true;});
  const o=it.opts[r.answer];shown=isUrl(optImg(o).u)?optImg(o).c:o;}
 else if(it.type==='match'){drawMatch(r.answer);shown=it.left.map((l,i)=>`${l} — ${it.right[r.answer[i]]}`).join(' · ');}
 else if(it.type==='build'||it.type==='spell'){document.querySelectorAll('#ansA .tile').forEach(t=>t.classList.add(r.correct?'ok':'no'));shown=r.answer;}
 else if(it.type==='type'){const t=$('tx');t.disabled=true;t.style.borderColor=r.correct?'#7FDB9C':'#FF9F9F';shown=r.answer;}
 const f=$('foot');f.classList.add(r.correct?'good':'wrong');
 f.querySelector('.in').innerHTML=`<div class="fb"><span class="ic">${r.correct?IC.check.replace('<svg','<svg style="color:var(--ok)"'):IC.x.replace('<svg','<svg style="color:var(--bad)"')}</span><div>${r.correct?T('Barakalla!')+(s.pay?` <span style="font-size:16px;display:inline-flex;align-items:center;vertical-align:middle">+${ME.cfg.rw.q} ${stk('coin').replace('class="stk','style="width:24px;height:24px" class="stk')}</span>`:''):T('Notoʻgʻri')}
  ${!r.correct&&shown?`<small>${it.type==='match'?T('Toʻgʻri juftlar:'):T('Toʻgʻri javob:')} <span class="${isAr(shown)&&it.type!=='match'?'ar':''}" style="font-size:${isAr(shown)&&it.type!=='match'?'22px':'15px'}">${esc(shown)}</span></small>`:''}</div>
  ${MS(r.correct?pickOne(['thumbs','cheer','stars','goodjob','bravo']):'think','fbm')}</div>
  <button class="btn ${r.correct?'ok':'bad'}" onclick="next()">${T('Davom etish')}</button>`;cyrDom(f);}
function next(){const s=SESS,r=LAST;if(!s)return;
 if(r&&r.fail){failScreen(r);return;}
 if(r&&r.end){endScreen(r);return;}
 s.i++;drawItem();}
function failScreen(r){$('ov').innerHTML=`<div class="body"><div class="res"><div class="hero">${MS('think')}</div><h2>${T('Jonlar tugadi')}</h2><p class="muted">${T('Bu bosqich uchun dinor berilmadi.')}${r.lost?` (−${r.lost})`:''}</p>
  <p class="muted" style="font-size:14px">${ME.cfg.reviewQ} ${T('savol')} · ${T('2 ta toʻgʻri javob = 1 jon')}</p></div></div>
  <div class="foot"><div class="in" style="display:grid;gap:12px"><button class="btn bad" onclick="closeOv();startReview('heart')">${T('Takrorlash — jon olish')}</button><button class="btn ghost" onclick="closeOv();refresh()">${T('Darslarga qaytish')}</button></div></div>`;cyrDom($('ov'));hap('err');sfx('fail');}
/* bayram effekti: konfetti + tangalar */
function fxBurst(coins){const fx=document.createElement('div');fx.className='fx';const C=['#F5B800','#2EC45E','#2F8CFF','#F04848','#9B5CF6','#FF7A45','#EC4899'];let h='';
 for(let i=0;i<70;i++){const d=2+Math.random()*2.2;h+=`<i class="cf" style="left:${Math.random()*100}%;background:${C[i%C.length]};animation-duration:${d}s;animation-delay:${Math.random()*.6}s;--dx:${(Math.random()-.5)*160}px;--r:${(Math.random()-.5)*900}deg;${i%3?'':'border-radius:50%;width:10px;height:10px;'}"></i>`;}
 for(let i=0;i<(coins||0);i++){const a=Math.random()*Math.PI*2,R=110+Math.random()*130;h+=`<span class="cn" style="--x:${Math.cos(a)*R}px;--y:${Math.sin(a)*R-60}px;--r:${(Math.random()-.5)*540}deg;animation-delay:${.1+i*.05}s">${stk('coin')}</span>`;}
 fx.innerHTML=h;document.body.appendChild(fx);fx.querySelectorAll('.cn .stk').forEach(s=>{s.style.width='38px';s.style.height='38px';});setTimeout(()=>fx.remove(),4800);}
function endScreen(r){const e=r.end;let hero=pickOne(['bravo','goodjob','party','cheer']),h=T('Qism tugadi!'),extra='',chips='';
 const chip=(c,lab,val,ico,d)=>`<div class="rc" style="animation-delay:${d||.3}s"><b style="background:${c}">${lab}</b><span>${ico?stk(ico):''}${val}</span></div>`;
 if(e.mode==='lesson'){chips=chip('#D08A00',T('Dinor'),'+'+e.gain,'coin',.5)+(e.total?chip('#1E9E48',T('Toʻgʻri'),`${e.ok}/${e.total}`,'star',.65):'');
  if(e.tree&&e.tree.grew)extra=`<p style="font-size:17px;font-weight:900;margin:6px 0;display:flex;align-items:center;justify-content:center;gap:6px">${stk('sprout').replace('class="stk','style="width:34px;height:34px" class="stk')} ${T(e.tree.msg)}!</p>`;
  if(e.replay&&!e.gain)extra+=`<p class="muted">${T('Takroriy — dinor berilmaydi')}</p>`;
  setTimeout(()=>{fxBurst(e.gain>0?14:0);sfx('fanfare');},150);}
 else if(e.mode==='heart'){hero='love';h=T('Natija');chips=chip('#E5333F',T('Jon olindi'),'+'+e.hearts,'heart')+chip('#1E9E48',T('Toʻgʻri'),`${e.ok}/${e.total}`,'star',.45);if(e.hearts>0){setTimeout(()=>{fxBurst(0);sfx('fanfare');},150);}else sfx('fail');}
 else {hero=e.watered?'stars':'think';h=e.watered?(e.tree&&e.tree.revived?T('Daraxt qayta tirildi!'):T('Daraxt sugʻorildi!')):T('Yetarli emas');
  chips=chip('#1E9E48',T('Toʻgʻri'),`${e.ok}/${e.total}`,'star')+(e.watered&&e.tree&&e.tree.added?chip('#E5333F',T('Meva'),'+'+e.tree.added,'apple',.45):'');
  if(!e.watered){extra=`<p class="muted">Kamida ${e.need} ta toʻgʻri javob kerak.</p>`;sfx('fail');}else{setTimeout(()=>{fxBurst(0);sfx('fanfare');},150);}}
 const lid=SESS.lid;END=e;
 $('ov').innerHTML=`<div class="body"><div class="res"><div class="hero">${MS(hero)}</div><h2 class="pop" style="animation-delay:.25s">${h}</h2><div class="chips">${chips}</div>${extra}</div></div>
  <div class="foot"><div class="in" style="display:grid;gap:12px">${e.mode==='water'&&!e.watered?`<button class="btn blue" onclick="closeOv();startReview('water','${lid}')">${T('Yana urinish')}</button>`:''}<button class="btn ok" onclick="afterEnd()">${T('Davom etish')}</button></div></div>`;
 cyrDom($('ov'));hap('ok');}

let CINE_T=null;
function playCine(stage,fruit,lid){const full=stage>=5;
 if(full&&ME.cfg.treeVideo){const d=document.createElement('div');d.id='cine';
  d.innerHTML=`<video src="${esc(ME.cfg.treeVideo)}" autoplay playsinline></video><button class="skip" onclick="endCine()">${T('Oʻtkazib yuborish')}</button><div class="cap" id="ccap" style="display:none"><h2>${T('Daraxtingiz meva soldi!')}</h2><p>+${fruit} ${T('Meva')}</p><button class="btn" onclick="endCine()">${T('Ajoyib!')}</button></div>`;
  document.body.appendChild(d);cyrDom(d);const v=d.querySelector('video');v.onended=()=>{$('ccap').style.display='';};v.onerror=()=>{d.remove();playCine2(stage,fruit);};backBtn();return;}
 playCine2(stage,fruit);}
function playCine2(stage,fruit){const full=stage>=5;const from=full?1:Math.max(1,stage-1);const step=full?1.15:1.0;const n=stage-from+1;
 const nA=full?Math.max(3,Math.min(fruit||3,7)):0;const tA=.4+n*step;const total=tA+(full?nA*.32+1.1:.3);
 let st='';for(let s=from;s<=stage;s++){const d=.35+(s-from)*step;st+=`<g class="stg" style="animation:stIn .8s cubic-bezier(.2,1.4,.4,1) ${d}s both${s<stage?`,stOut .35s ${d+step-.1}s forwards`:''}">${treeG(s,0,false,{noShadow:1,still:1})}</g>`;}
 let ap='';for(let i=0;i<nA;i++)ap+=`<g class="apl" style="animation:aplIn .5s cubic-bezier(.2,1.6,.4,1) ${tA+i*.32}s both">${appleG(APL[i][0],APL[i][1])}</g>`;
 let sp='';const SP=[[-50,-120],[48,-110],[-60,-60],[58,-55],[0,-140],[-30,-150],[30,-145],[70,-90],[-72,-95]];if(full)SP.forEach((p,i)=>{sp+=`<path class="spark" style="animation-delay:${tA+nA*.32+i*.12}s" d="M${p[0]} ${p[1]-7}l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#FFF7B0"/>`;});
 let lv='';if(full)for(let i=0;i<6;i++)lv+=`<ellipse class="leaf" style="animation-delay:${1+i*.9}s" cx="${-40+i*15}" cy="-110" rx="4" ry="2" fill="#5BC955"/>`;
 let rays='';for(let i=0;i<16;i++)rays+=`<path d="M200 170L${200+Math.cos(i/16*Math.PI*2)*700} ${170+Math.sin(i/16*Math.PI*2)*700}L${200+Math.cos((i+.45)/16*Math.PI*2)*700} ${170+Math.sin((i+.45)/16*Math.PI*2)*700}z" fill="#FFF6C8" opacity=".22"/>`;
 const BY=full?465:430;   // daraxt asosi — pastdagi yozuv va maskot uni toʻsmasin
 const d=document.createElement('div');d.id='cine';d.style.setProperty('--dur',(n*step+.6)+'s');d.style.setProperty('--by',BY+'px');
 d.innerHTML=`<svg class="sc" viewBox="0 0 400 700" preserveAspectRatio="xMidYMax slice"><rect width="400" height="700" fill="url(#gSky)"/><g class="rays">${rays}</g><circle cx="200" cy="170" r="110" fill="url(#gSun)"/><circle cx="200" cy="170" r="38" fill="#FFF3A0"/>
  <g class="par1"><g class="drift" style="animation-duration:26s"><g transform="translate(70 120)"><ellipse rx="44" ry="15" fill="#fff"/><ellipse cx="-18" cy="-8" rx="20" ry="15" fill="#fff"/><ellipse cx="16" cy="-12" rx="22" ry="18" fill="#fff"/></g><g transform="translate(330 220) scale(.8)"><ellipse rx="44" ry="15" fill="#fff"/><ellipse cx="-18" cy="-8" rx="20" ry="15" fill="#fff"/><ellipse cx="16" cy="-12" rx="22" ry="18" fill="#fff"/></g></g>
   <path d="M-80 700V420Q0 360 90 410T260 400T480 410V700z" fill="url(#gHill1)"/></g>
  <g class="par2"><path d="M-100 700V470Q20 430 140 470T380 460T520 470V700z" fill="url(#gHill2)"/>${Array.from({length:7},(_,i)=>`<g transform="translate(${-40+i*80} ${478+(i%2)*6}) scale(.35)">${treeG(4+(i%2),i%2?3:0,false,{noShadow:1,still:1})}</g>`).join('')}</g>
  <g class="cam"><rect x="-200" y="${BY-40}" width="800" height="400" fill="url(#gGrass)"/><g transform="translate(200 ${BY}) scale(${full?2.25:2.6})"><ellipse cx="0" cy="3" rx="40" ry="7" fill="#1B3A0F" opacity=".2"/><ellipse cx="0" cy="-1" rx="22" ry="7" fill="url(#gSoil)"/>${st}${ap}${sp}${lv}</g></g>
  <g class="par3">${Array.from({length:14},(_,i)=>`<path d="M${i*31} 700l-6-34M${i*31+6} 700l2-40M${i*31+12} 700l8-30" stroke="#3E9B3E" stroke-width="5" stroke-linecap="round"/>`).join('')}</g></svg>
  <button class="skip" onclick="endCine()">${T('Oʻtkazib yuborish')}</button>
  <div class="cap"><div class="caprow">${MS(full?'trophy':'cheer','',`opacity:0;animation:capIn .6s cubic-bezier(.2,1.6,.4,1) ${total-.6}s both`)}<div><h2 style="animation-delay:${total-.4}s">${full?T('Daraxtingiz meva soldi!'):T(['','Nihol ekildi','Unib chiqdi','Nihol boʻldi','Daraxt boʻldi','Meva soldi'][stage])+'!'}</h2>
   ${full?`<p style="animation-delay:${total-.2}s;margin:0">+${fruit||3} ${T('Meva')} · ${T('Dalada')} ${ME.garden.count} ${T('ta daraxt')}</p>`:''}</div></div><button class="btn" style="animation-delay:${total}s" onclick="endCine()">${T('Ajoyib!')}</button></div>`;
 document.body.appendChild(d);cyrDom(d);backBtn();hap('medium');
 sfx('grow',n,step);if(full)sfx('fruit',tA,nA);
 clearTimeout(CINE_T);CINE_T=setTimeout(()=>hap('ok'),total*1000);}

 if(D.items.length)h+=`<h3 class="sec">${T('Toʻlovlarim')}</h3><div class="list">${D.items.map(x=>{const s=PST[x.status]||[x.status,'#8C7B58'];return `<div class="ord">${stk('coin').replace('class="stk','style="width:34px;height:34px" class="stk')}<div class="grow"><b>${fmt(x.dinor)} ${T('dinor')}</b><div class="muted" style="font-size:12.5px">${esc(String(x.at).slice(0,10).split('-').reverse().join('.'))} · ${sumF(x.sum)} ${T('soʻm')}${x.reason?` · ${esc(x.reason)}`:''}</div></div><span class="st" style="background:${s[1]}22;color:${s[1]}">${T(s[0])}</span></div>`;}).join('')}</div>`;

function copyCard(){const c=BUY&&BUY.d&&BUY.d.card;if(!c)return;try{navigator.clipboard.writeText(c.replace(/\s/g,''));toast(T('Nusxa olindi'));hap('ok');}catch(e){}}
function shrinkImg(f,max,q){return new Promise((res,rej)=>{const u=URL.createObjectURL(f);const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',q));};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'));};im.src=u;});}
async function payPick(inp){const f=inp.files&&inp.files[0];if(!f)return;try{BUY.img=await shrinkImg(f,1600,.82);BUY.sent=false;render();}catch(e){toast(T('Rasmni oʻqib boʻlmadi'));}}

 catch(e){b.disabled=false;b.textContent=T('Yuborish');toast(e.message);}}

const DAYS={Du:[1,'Dushanba','Пн'],Se:[2,'Seshanba','Вт'],Ch:[3,'Chorshanba','Ср'],Cho:[3,'Chorshanba','Ср'],Pa:[4,'Payshanba','Чт'],Ju:[5,'Juma','Пт'],Sh:[6,'Shanba','Сб'],Sha:[6,'Shanba','Сб'],Ya:[0,'Yakshanba','Вс']};
function nextLesson(g){const days=(Array.isArray(g.days)?g.days:String(g.days||'').split(/[\s,]+/)).map(d=>DAYS[d]).filter(Boolean);if(!days.length||!g.time)return '';
 const now=new Date(Date.now()+5*3600e3);const [hh,mm]=g.time.split(':').map(Number);
 for(let k=0;k<8;k++){const d=new Date(now.getTime()+k*864e5);const wd=d.getUTCDay();if(!days.some(x=>x[0]===wd))continue;
  if(k===0&&(now.getUTCHours()*60+now.getUTCMinutes())>hh*60+mm+(+g.dur||90))continue;
  const day=days.find(x=>x[0]===wd);return `${k===0?T('bugun'):k===1?T('ertaga'):(LANG==='ru'?day[2]:day[1])}, ${g.time}`;}
 return '';}

  <div class="list"><div class="li" style="flex-wrap:wrap">${stk('globe')}<span class="t">${T('Til')}</span>
   <div class="seg nt" style="width:100%;margin-top:4px">${[['uz','Lotin'],['cy','Кирилл'],['ru','Русский']].map(([k,n])=>`<button class="${LANG===k?'on':''}" onclick="setLang('${k}')">${n}</button>`).join('')}</div></div>
   <button class="li" onclick="setDark()">${stk('moon')}<span class="t">${T('Tungi rejim')}</span><span class="tg ${p.dark?'on':''}"></span></button></div>`;

 try{if(/^https:\/\/t\.me\//.test(u)&&TG&&TG.openTelegramLink){TG.openTelegramLink(u);return;}if(TG&&TG.openLink){TG.openLink(u);return;}}catch(e){}window.open(u,'_blank');}
