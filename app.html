<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Natiq Arab</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#F5B800;--gold-d:#C98A00;--gold-l:#FFF1C2;--gold-ll:#FFF9E6;--bg:#FFFDF7;--card:#FFFFFF;--ink:#2A200E;--mut:#8C7B58;--line:#F1E7CC;--soft:#FBF5E4;
 --ok:#2EC45E;--ok-d:#1E9E48;--ok-l:#DDF8E6;--bad:#F04848;--bad-d:#C93030;--bad-l:#FFE2E2;--blue:#2F8CFF;--blue-d:#1D6FD6;--blue-l:#E2F0FF;--purple:#9B5CF6;--coral:#FF7A45;
 --lock:#E6E0D0;--lock-d:#CFC7B2;--nav:68px;--r:18px;--shadow:0 2px 0 var(--line);}
:root.dark{--bg:#14110A;--card:#211C11;--ink:#FFF5DA;--mut:#B6A57E;--line:#3A311D;--soft:#1B170E;--gold-l:#3B2F0E;--gold-ll:#251F0E;--lock:#3A3324;--lock-d:#2A2416;
 --ok-l:#123A22;--bad-l:#3D1717;--blue-l:#13294A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:700}
body{min-height:100vh;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit}
.ar{font-family:"Noto Naskh Arabic","Geeza Pro","Traditional Arabic",serif;direction:rtl;unicode-bidi:isolate;font-weight:700;line-height:1.5}
.hide{display:none!important}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom))}
/* ----- top stats ----- */
.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:2px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden}
.brand .lg{width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,#FFD84D,var(--gold) 55%,var(--gold-d));display:grid;place-items:center;color:#fff;font-size:18px;box-shadow:0 2px 0 var(--gold-d);flex:none}
.stat{display:flex;align-items:center;gap:4px;font-weight:900;font-size:15px;padding:4px 7px;border-radius:12px}
.stat svg{width:22px;height:22px;flex:none}
.s-heart{color:var(--bad)}.s-coin{color:var(--gold-d)}.s-apple{color:#E5484D}.s-tree{color:var(--ok-d)}
:root.dark .s-coin{color:var(--gold)}
/* ----- bottom nav ----- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav)}
.nb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:800;color:var(--mut);position:relative}
.nb svg{width:28px;height:28px}
.nb.on{color:var(--gold-d)}:root.dark .nb.on{color:var(--gold)}
.nb.on::before{content:"";position:absolute;top:6px;width:52px;height:38px;border-radius:14px;background:var(--gold-l);z-index:-1;border:2px solid #F7D46B}
:root.dark .nb.on::before{border-color:#5A4813}
.wrap{padding:16px 16px 8px}
h2.tt{font-size:24px;font-weight:900;margin:4px 0 2px}
.sub{color:var(--mut);font-size:14px;margin:0 0 14px}
/* ----- buttons ----- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:16px;font-weight:900;font-size:16px;letter-spacing:.4px;text-transform:uppercase;
 background:var(--gold);color:#3A2800;box-shadow:0 4px 0 var(--gold-d);transition:transform .06s,box-shadow .06s;padding:0 16px}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--gold-d)}
.btn.ok{background:var(--ok);color:#fff;box-shadow:0 4px 0 var(--ok-d)}.btn.bad{background:var(--bad);color:#fff;box-shadow:0 4px 0 var(--bad-d)}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-d)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn:disabled,.btn.off{background:var(--lock);color:var(--mut);box-shadow:0 4px 0 var(--lock-d);pointer-events:none}
.btn.sm{min-height:40px;font-size:13.5px;border-radius:13px;width:auto;padding:0 14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 3px 0 var(--line)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--mut)}
/* ----- path ----- */
.unit{border-radius:20px;padding:16px 18px;color:#fff;display:flex;align-items:center;gap:12px;margin:18px 0 8px;position:relative;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.unit .k{font-size:12.5px;font-weight:900;opacity:.92;text-transform:uppercase;letter-spacing:.6px}
.unit h3{margin:2px 0 6px;font-size:21px;font-weight:900}
.unit .bar{height:8px;border-radius:9px;background:rgba(255,255,255,.35);overflow:hidden;max-width:180px}
.unit .bar i{display:block;height:100%;background:#fff;border-radius:9px}
.unit .big{font-size:58px;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.15);min-width:64px;text-align:center}
.path{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;padding:12px 0 6px}
.node{width:76px;height:70px;border-radius:50%;display:grid;place-items:center;position:relative;background:var(--gold);box-shadow:0 7px 0 var(--gold-d);color:#fff;transition:transform .08s}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--gold-d)}
.node svg{width:34px;height:34px}
.node.done{background:var(--gold)}
.node.lock{background:var(--lock);box-shadow:0 7px 0 var(--lock-d);color:#B3A98F}
:root.dark .node.lock{color:#6F6650}
.node.empty{background:var(--soft);box-shadow:0 7px 0 var(--lock-d);color:var(--mut);border:3px dashed var(--lock-d)}
.node.cur{animation:none}
.node .ring{position:absolute;inset:-10px;border-radius:50%;border:5px solid var(--gold-l)}
.tip{position:absolute;bottom:calc(100% + 14px);left:50%;transform:translateX(-50%);background:var(--card);color:var(--gold-d);border:2px solid var(--line);border-radius:13px;padding:7px 12px;
 font-weight:900;font-size:13px;white-space:nowrap;animation:bob 1.4s ease-in-out infinite;text-transform:uppercase;letter-spacing:.5px}
.tip::after{content:"";position:absolute;top:100%;left:50%;margin-left:-8px;border:8px solid transparent;border-top-color:var(--line)}
@keyframes bob{50%{transform:translate(-50%,-6px)}}
.nwrap.cw{margin-top:34px}
.nlab{font-size:12px;color:var(--mut);margin-top:-6px;font-weight:800}
.nwrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.chest{font-size:12px}
.alert{display:flex;align-items:center;gap:12px;background:var(--bad-l);border:2px solid #FFC4C4;border-radius:16px;padding:12px 14px;margin:6px 0 4px}
:root.dark .alert{border-color:#5C2323}
.alert.gold{background:var(--gold-l);border-color:#F7D46B}:root.dark .alert.gold{border-color:#5A4813}
.alert svg{width:30px;height:30px;flex:none}
/* ----- sheet ----- */
.scrim{position:fixed;inset:0;background:rgba(20,14,0,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.9,.3,1)}
.sheet.on{transform:none}
.sheet:not(.on){visibility:hidden;transition:transform .26s,visibility 0s .26s}
.sheet .in{max-width:560px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:4px 0 6px;font-size:21px;font-weight:900}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:5px 11px;font-size:13px;font-weight:900;background:var(--soft);border:2px solid var(--line)}
.pill svg{width:17px;height:17px}
/* ----- lesson overlay ----- */
#ov{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column}
#ov .head{display:flex;align-items:center;gap:12px;padding:14px 16px 8px;max-width:620px;width:100%;margin:0 auto}
.x{width:36px;height:36px;display:grid;place-items:center;color:var(--mut)}
.x svg{width:26px;height:26px}
.prog{flex:1;height:16px;border-radius:12px;background:var(--lock);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(var(--ok),var(--ok-d));border-radius:12px;transition:width .35s;position:relative}
.prog i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:4px;background:rgba(255,255,255,.4)}
.hearts{display:flex;align-items:center;gap:4px;color:var(--bad);font-weight:900;font-size:18px}
.hearts svg{width:26px;height:26px}
.hearts.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
#ov .body{flex:1;overflow:auto;padding:10px 18px 20px;max-width:620px;width:100%;margin:0 auto}
#ov .foot{border-top:2px solid var(--line);padding:16px 18px calc(16px + env(safe-area-inset-bottom));transition:background .2s}
#ov .foot .in{max-width:620px;margin:0 auto}
#ov .foot.good{background:var(--ok-l);border-color:transparent}
#ov .foot.wrong{background:var(--bad-l);border-color:transparent}
.fb{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-weight:900;font-size:20px}
.fb .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fff;flex:none}
.fb .ic svg{width:28px;height:28px}
.good .fb{color:var(--ok-d)}.wrong .fb{color:var(--bad-d)}
.fb small{display:block;font-size:15px;font-weight:800;margin-top:2px}
.qh{font-size:21px;font-weight:900;margin:8px 0 14px;line-height:1.3}
.qar{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 18px}
.qar .ar{font-size:64px;line-height:1.3}
.spk{width:58px;height:58px;border-radius:16px;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 4px 0 var(--blue-d);flex:none}
.spk:active{transform:translateY(4px);box-shadow:none}
.spk svg{width:30px;height:30px}
.spk.big{width:110px;height:110px;border-radius:28px}.spk.big svg{width:56px;height:56px}
.opts{display:grid;gap:10px}
.opts.g2{grid-template-columns:1fr 1fr}
.op{min-height:58px;border-radius:16px;border:2px solid var(--line);background:var(--card);box-shadow:0 4px 0 var(--line);padding:10px 14px;font-size:17px;font-weight:800;text-align:left;display:flex;align-items:center;gap:12px;transition:transform .05s}
.op .n{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:var(--mut);flex:none}
.op.ar{justify-content:center;font-size:34px;min-height:84px;text-align:center}
.op.sel{border-color:#86C3FF;background:var(--blue-l);box-shadow:0 4px 0 #86C3FF;color:var(--blue-d)}
.op.right{border-color:#7FDB9C;background:var(--ok-l);box-shadow:0 4px 0 #7FDB9C;color:var(--ok-d)}
.op.wrongc{border-color:#FF9F9F;background:var(--bad-l);box-shadow:0 4px 0 #FF9F9F;color:var(--bad-d)}
.op:active{transform:translateY(3px)}
.qimg{display:block;max-width:100%;max-height:220px;border-radius:16px;margin:0 auto 14px;border:2px solid var(--line)}
.bigcard{border-radius:28px;background:linear-gradient(160deg,#FFF6D6,#FFE7A0);border:3px solid #F7D46B;box-shadow:0 6px 0 #E9BF45;padding:26px 18px 22px;text-align:center;margin:10px 0 18px;color:#3A2800}
:root.dark .bigcard{background:linear-gradient(160deg,#3B300F,#2A220C);border-color:#6B5414;box-shadow:0 6px 0 #4B3B0E;color:var(--ink)}
.bigcard .ar{font-size:110px;line-height:1.25}
.bigcard .tr{font-size:26px;font-weight:900;margin-top:2px}
.bigcard .mn{font-size:17px;color:#8A6A10;margin-top:4px}
:root.dark .bigcard .mn{color:var(--mut)}
.lst{font-size:13px;color:var(--mut);margin-top:12px}
.rule{font-size:17px;line-height:1.6;font-weight:700}
.rule p{margin:0 0 12px}
.rule .ar{font-size:30px}
.vid{width:100%;aspect-ratio:16/9;border-radius:18px;background:#000;border:0;display:block}
.words{display:grid;gap:10px}
.word{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 var(--line)}
.word .ar{font-size:34px;min-width:84px;text-align:center}
.word .spk{width:44px;height:44px;border-radius:13px}.word .spk svg{width:22px;height:22px}
/* result */
.res{text-align:center;padding:26px 6px}
.res .em{font-size:84px;line-height:1}
.res h2{font-size:28px;font-weight:900;margin:12px 0 6px}
.res .chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.rc{border-radius:16px;border:2px solid var(--line);min-width:96px;overflow:hidden;background:var(--card)}
.rc b{display:block;padding:6px 10px;font-size:12px;color:#fff;text-transform:uppercase;letter-spacing:.4px}
.rc span{display:flex;align-items:center;justify-content:center;gap:5px;padding:10px;font-size:22px;font-weight:900}
.rc span svg{width:24px;height:24px}
.treebox{width:150px;height:150px;margin:6px auto 0}
/* rating */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;margin:12px 0 18px}
.pd{text-align:center}
.pd .av{margin:0 auto 6px}
.pd .nm{font-size:13.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pd .sc{display:inline-flex;align-items:center;gap:3px;font-size:13px;color:var(--gold-d);font-weight:900}
:root.dark .pd .sc{color:var(--gold)}
.pd .sc svg{width:16px;height:16px}
.pd .base{border-radius:14px 14px 4px 4px;margin-top:8px;display:grid;place-items:center;color:#fff;font-size:28px;font-weight:900;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:20px;position:relative;flex:none;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line)}
.av.lg{width:68px;height:68px;font-size:26px}
.crown{position:absolute;top:-20px;left:50%;transform:translateX(-50%);width:30px;height:24px}
.rl{display:flex;flex-direction:column;gap:8px}
.rr{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:9px 12px}
.rr .rk{width:26px;text-align:center;font-weight:900;color:var(--mut)}
.rr .av{width:40px;height:40px;font-size:16px;border-width:2px}
.rr .nm{flex:1;min-width:0;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr .sc{display:flex;align-items:center;gap:4px;font-weight:900}
.rr .sc svg{width:20px;height:20px;color:var(--gold-d)}
.rr.me{background:var(--gold-l);border-color:#F7D46B}
:root.dark .rr.me{border-color:#5A4813}
.mine{position:sticky;bottom:calc(var(--nav) + 10px + env(safe-area-inset-bottom));margin-top:12px;box-shadow:0 4px 0 #EFC649,0 8px 22px rgba(120,80,0,.18)}
/* garden */
.gstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.gs{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px;text-align:center}
.gs b{display:flex;align-items:center;justify-content:center;gap:5px;font-size:22px;font-weight:900}
.gs b svg{width:24px;height:24px}
.gs span{font-size:12px;color:var(--mut)}
.trees{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tree{background:linear-gradient(180deg,#E9F7FF 0%,#F4FBFF 58%,#EAF8E3 58.1%,#DFF3D2 100%);border:2px solid var(--line);border-radius:18px;padding:10px 10px 12px;text-align:center;position:relative;overflow:hidden}
:root.dark .tree{background:linear-gradient(180deg,#142233 0%,#16263A 58%,#15301C 58.1%,#123019 100%)}
.tree.dry{background:linear-gradient(180deg,#F3EEE4 0%,#F6F1E7 58%,#EADFC9 58.1%,#E2D4B8 100%)}
:root.dark .tree.dry{background:linear-gradient(180deg,#2A251B 0%,#2C271C 58%,#3A3020 58.1%,#33291A 100%)}
.tree svg.tv{width:100%;height:120px;display:block}
.tree .lt{position:absolute;top:8px;left:10px;font-size:26px;color:var(--ink);opacity:.85}
.tree .st{font-size:13px;font-weight:900;margin:2px 0 8px}
.tree .badge{position:absolute;top:8px;right:8px;font-size:11px;font-weight:900;border-radius:99px;padding:3px 8px;background:#fff;border:2px solid var(--line)}
:root.dark .tree .badge{background:var(--card)}
.tree .btn{min-height:38px;font-size:12px;border-radius:12px;padding:0 8px;letter-spacing:.2px}
.empty{text-align:center;padding:30px 16px;color:var(--mut)}
.empty .em{font-size:64px}
/* profile */
.phead{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.code{font-family:ui-monospace,Menlo,monospace;letter-spacing:2px;background:var(--soft);border:2px solid var(--line);border-radius:9px;padding:2px 8px;font-size:13px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.sg{border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;align-items:center;gap:10px;background:var(--card)}
.sg svg{width:30px;height:30px;flex:none}
.sg b{display:block;font-size:20px;font-weight:900;line-height:1.1}
.sg span{font-size:12.5px;color:var(--mut)}
.list{background:var(--card);border:2px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.li{display:flex;align-items:center;gap:12px;padding:14px;border-top:2px solid var(--line);width:100%;text-align:left}
.li:first-child{border-top:0}
.li .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.li .ico svg{width:22px;height:22px}
.li .t{flex:1;min-width:0}
.li .t small{display:block;color:var(--mut);font-size:12.5px;font-weight:700}
.chev{width:20px;height:20px;color:var(--mut)}
.seg{display:flex;background:var(--soft);border:2px solid var(--line);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px 8px;border-radius:10px;font-size:13px;font-weight:900;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 0 var(--line)}
.tg{width:52px;height:30px;border-radius:99px;background:var(--lock);position:relative;transition:background .2s;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tg.on{background:var(--ok)}.tg.on::after{transform:translateX(22px)}
.live{border-radius:var(--r);padding:16px;color:#fff;background:linear-gradient(135deg,#2F8CFF,#7B5CFF);box-shadow:0 4px 0 #3C4FC9;margin-bottom:14px}
.live h4{margin:0 0 4px;font-size:18px;font-weight:900}
.live .btn{background:#fff;color:#2D47C7;box-shadow:0 4px 0 #C9D3FF;margin-top:12px}
/* market */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prod{background:var(--card);border:2px solid var(--line);border-radius:18px;overflow:hidden;text-align:left;box-shadow:0 3px 0 var(--line)}
.prod .im{aspect-ratio:1;background:var(--soft) center/cover no-repeat;display:grid;place-items:center;font-size:44px}
.prod .pi{padding:10px 12px}
.prod .pn{font-weight:900;font-size:14.5px;line-height:1.25;min-height:36px}
.price{display:inline-flex;align-items:center;gap:4px;font-weight:900;color:var(--gold-d);font-size:16px}
:root.dark .price{color:var(--gold)}
.price svg{width:20px;height:20px}

async function api(name,body){
 const r=await fetch('/api/'+name,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.assign({initData:TG?TG.initData:''},body||{}))});
 let j={};try{j=await r.json();}catch(e){}
 if(!r.ok){const e=new Error(j.error||('HTTP '+r.status));e.code=j.code;e.status=r.status;throw e;}return j;}
function toast(m){const t=$('toast');t.textContent=m;cyrDom(t);t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2600);}
const hap=(k)=>{try{if(!TG||!TG.HapticFeedback)return;if(k==='ok'||k==='err'||k==='warn')TG.HapticFeedback.notificationOccurred({ok:'success',err:'error',warn:'warning'}[k]);else TG.HapticFeedback.impactOccurred(k||'light');}catch(e){}};
let AC=null;function beep(ok){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;
 (ok?[[660,0],[880,.09]]:[[220,0],[180,.12]]).forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ok?'sine':'square';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(ok?.18:.06,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.16);o.connect(g).connect(AC.destination);o.start(t+d);o.stop(t+d+.18);});}catch(e){}}

let AUD=null;
function speak(text,url){try{if(AUD){AUD.pause();AUD=null;}if(window.speechSynthesis)speechSynthesis.cancel();}catch(e){}
 if(url){AUD=new Audio(url);AUD.play().catch(()=>sayTTS(text));return;}sayTTS(text);}
function sayTTS(text){if(!text||!window.speechSynthesis){toast('🔇 '+T('Tinglang'));return;}
 const u=new SpeechSynthesisUtterance(text);u.lang='ar-SA';u.rate=.8;const v=speechSynthesis.getVoices().find(v=>/^ar/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u);}
try{window.speechSynthesis&&speechSynthesis.getVoices();}catch(e){}

   ${it.desc?`<p class="rule" style="margin-top:14px">${fmtText(it.desc)}</p>`:''}`;

 else if(it.t==='rule'){body=`<div class="qh">${esc(TL(it.title||T('Qoidalar'),''))}</div>${it.img?`<img class="qimg" src="${esc(it.img)}" alt="">`:''}<div class="card rule">${fmtText(TL(it.text,it.ru))}</div>`;
  foot=`<button class="btn" onclick="answer()">${T('Tushundim')}</button>`;}
 else if(it.t==='card'){body=`<div class="qh" style="text-align:center">${T('Bosing va tinglang')}</div><div class="bigcard pop" onclick="playCard()"><div class="ar">${esc(it.ar)}</div>${it.tr?`<div class="tr nt">${esc(it.tr)}</div>`:''}${it.uz||it.ru?`<div class="mn">${esc(TL(it.uz,it.ru))}</div>`:''}</div>

 else if(it.t==='words'){body=`<div class="qh">${T('Soʻzlarni oʻrganing')}</div><div class="words">${it.words.map((w,i)=>`<div class="word"><button class="spk" onclick="speak(${esc(JSON.stringify(w.ar))},${esc(JSON.stringify(w.audio||''))})">${IC.vol}</button><div class="ar">${esc(w.ar)}</div><div class="grow"><b>${esc(TL(w.uz,w.ru))}</b>${w.tr?`<div class="muted nt" style="font-size:13px">${esc(w.tr)}</div>`:''}</div></div>`).join('')}</div>`;

 else {const arO=it.arOpts||it.opts.every(o=>/[؀-ۿ]/.test(o)&&o.length<=12);

   <div class="opts ${arO||it.opts.length===4&&it.opts.every(o=>o.length<=14)?'g2':''}" id="opts">${it.opts.map((o,i)=>`<button class="op ${arO?'ar':''}" data-i="${i}" onclick="pick(${i})">${arO?'':`<span class="n">${i+1}</span>`}<span>${esc(o)}</span></button>`).join('')}</div>`;

 $('ov').innerHTML=ovHead()+`<div class="body">${body}</div><div class="foot" id="foot"><div class="in">${foot}</div></div>`;cyrDom($('ov'));
 if(it.t==='video')videoGate(!!ytId(it.url));

function videoGate(yt){const b=$('go'),vt=$('vt');if(!b)return;
 if(yt){let n=20;const t=setInterval(()=>{if(!$('vt')){clearInterval(t);return;}n--;vt.textContent=n>0?`(${n})`:'';if(n<=0){b.disabled=false;clearInterval(t);}},1000);vt.textContent='(20)';return;}
 const v=$('vd');if(!v){b.disabled=false;return;}
 v.addEventListener('timeupdate',()=>{if(v.duration&&v.currentTime/v.duration>.85)b.disabled=false;});v.addEventListener('ended',()=>{b.disabled=false;});v.addEventListener('error',()=>{b.disabled=false;});}
const ytId=u=>{const m=/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([\w-]{11})/.exec(String(u||''));return m?m[1]:'';};

async function send(extra){const s=SESS;let r;
 try{r=await api('step',Object.assign({sid:s.sid,i:s.i},extra));}catch(e){LOCK=false;const g=$('go');if(g)g.disabled=false;toast(e.message);if(e.code==='no_sess'){closeOv();refresh();}return;}
 if(r.code==='sync'){s.i=r.i;drawItem();return;}
 ME.prog.hearts=r.hearts;s.gain=r.gain;LAST=r;const it=s.items[s.i];
 if(it.t==='q'){document.querySelectorAll('#opts .op').forEach(b=>{const i=+b.dataset.i;b.classList.remove('sel');if(i===r.answer)b.classList.add('right');else if(i===SEL&&!r.correct)b.classList.add('wrongc');b.disabled=true;});
  if(r.correct){s.ok++;beep(1);hap('ok');}else{beep(0);hap('err');const h=$('hrt');if(h){h.querySelector('span').textContent=r.hearts;h.classList.remove('shake');void h.offsetWidth;h.classList.add('shake');}}
  const f=$('foot');f.classList.add(r.correct?'good':'wrong');
  f.querySelector('.in').innerHTML=`<div class="fb"><span class="ic">${r.correct?IC.check.replace('<svg','<svg style="color:var(--ok)"'):IC.x.replace('<svg','<svg style="color:var(--bad)"')}</span><div>${r.correct?T('Barakalla!')+(s.pay?` <span style="font-size:16px">+${ME.cfg.rw.q} 🪙</span>`:''):T('Notoʻgʻri')}${r.correct?'':`<small>${T('Toʻgʻri javob:')} <span class="${/[؀-ۿ]/.test(it.opts[r.answer])?'ar':''}" style="font-size:18px">${esc(it.opts[r.answer])}</span></small>`}</div></div>

 } else next();}

function failScreen(r){$('ov').innerHTML=`<div class="body"><div class="res"><div class="em pop">💔</div><h2>${T('Jonlar tugadi')}</h2><p class="muted">${T('Bu bosqich uchun dinor berilmadi.')}${r.lost?` (−${r.lost} 🪙)`:''}</p>

 else {em=e.watered?'💧':'🥀';h=e.watered?(e.tree&&e.tree.revived?T('Daraxt qayta tirildi!'):T('Daraxt sugʻorildi!')):T('Yetarli emas');

 const g='<ellipse cx="60" cy="104" rx="40" ry="8" fill="#8B5A2B" opacity=".22"/>';
 const mound='<path d="M30 104c6-12 54-12 60 0z" fill="#9A6234"/><path d="M38 100c8-5 36-5 44 0" stroke="#B87A45" stroke-width="3" fill="none" stroke-linecap="round"/>';
 const leaf=(x,y,r,c)=>`<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r*.55}" fill="${c}" transform="rotate(${x<60?-30:30} ${x} ${y})"/>`;
 const G1=dry?'#B9A27A':'#3DBE5C',G2=dry?'#CDB892':'#5FD67A',G3=dry?'#A08860':'#2AA048',TR=dry?'#7D5B3A':'#8B5528';
 let s='';
 if(stage<=1)s=mound+`<ellipse cx="60" cy="95" rx="6" ry="4.5" fill="#6B3E1A"/><path d="M60 92c0-5 2-8 5-9" stroke="${G1}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
 else if(stage===2)s=mound+`<path d="M60 98V80" stroke="${G3}" stroke-width="4" stroke-linecap="round"/>${leaf(51,79,9,G1)}${leaf(69,77,10,G2)}`;
 else if(stage===3)s=mound+`<path d="M60 99V58" stroke="${TR}" stroke-width="5" stroke-linecap="round"/><path d="M60 80l-11-8M60 70l12-9" stroke="${TR}" stroke-width="3.5" stroke-linecap="round"/>${leaf(46,70,11,G1)}${leaf(74,59,12,G2)}${leaf(60,54,10,G1)}${leaf(52,84,8,G2)}`;
 else {const big=stage>=5;const R=big?34:28,cy=big?50:56;
  s=`<path d="M56 104l1-${big?46:38}h6l1 ${big?46:38}z" fill="${TR}"/><path d="M60 78l-14-12M61 72l13-11" stroke="${TR}" stroke-width="4" stroke-linecap="round"/>`+(dry?
   `<path d="M46 66l-8-10M74 61l9-9M60 60V40M60 48l-8-7M60 45l8-8" stroke="${TR}" stroke-width="3" stroke-linecap="round"/><circle cx="40" cy="58" r="5" fill="${G2}"/><circle cx="84" cy="54" r="4" fill="${G1}"/><circle cx="55" cy="40" r="4" fill="${G2}"/>`:
   `<circle cx="60" cy="${cy}" r="${R}" fill="${G1}"/><circle cx="${60-R*.55}" cy="${cy+R*.25}" r="${R*.55}" fill="${G1}"/><circle cx="${60+R*.55}" cy="${cy+R*.2}" r="${R*.6}" fill="${G1}"/><circle cx="${60-R*.35}" cy="${cy-R*.35}" r="${R*.42}" fill="${G2}"/><circle cx="${60+R*.2}" cy="${cy-R*.5}" r="${R*.25}" fill="${G2}" opacity=".8"/>`);
  if(big&&!dry){const P=[[44,46],[72,40],[58,64],[82,60],[38,64],[64,30]];for(let i=0;i<Math.min(fruit,6);i++){const [x,y]=P[i];s+=`<circle cx="${x}" cy="${y}" r="6.5" fill="#F0474D"/><circle cx="${x-2}" cy="${y-2}" r="2" fill="#fff" opacity=".6"/><path d="M${x} ${y-6}l1.5-3" stroke="#6B3E1A" stroke-width="1.6" stroke-linecap="round"/>`;}}}
 return `<svg class="tv" viewBox="0 0 120 112" style="${dry?'filter:saturate(.6)':''}">${g}${s}</svg>`;}
function gardenView(){const G=ME.garden,C=ME.cfg;const L=id=>ME.path.find(x=>x.id===id)||{};
 let h=`<div class="wrap"><h2 class="tt">${T('Bogʻ')}</h2><p class="sub">${T('Har bir harf — 5 qism. Har qism tugaganda daraxtingiz oʻsadi.')}</p>
  <div class="gstats"><div class="gs"><b>${IC.tree}${G.count}</b><span>${T('Daraxt')}</span></div><div class="gs"><b>${IC.apple}${G.fruit}</b><span>${T('Meva')}</span></div><div class="gs"><b style="color:#A07A4A">🥀${G.dry}</b><span>${T('Quridi')}</span></div></div>`;
 if(G.sellable>0)h+=`<div class="card" style="margin-bottom:12px;display:flex;align-items:center;gap:12px"><div class="grow"><b>${T('Mevalarni sotish')}</b><div class="muted" style="font-size:13px">${G.sellable} × ${C.fruitPrice} = <b class="price" style="font-size:14px">${IC.coin}${fmt(G.sellable*C.fruitPrice)}</b></div></div><button class="btn sm ok" onclick="sellFruit()">${T('Sotish')}</button></div>`;
 if(!G.trees.length)return h+`<div class="empty"><div class="em">🌱</div><h3>${T('Bogʻingiz hali boʻsh')}</h3><p>${T('Harfning 1-qismini tugating — bogʻga nihol ekiladi.')}</p><button class="btn" style="max-width:280px;margin:12px auto 0" onclick="go('learn')">${T('Darslar')}</button></div></div>`;
 h+=`<div class="trees">${G.trees.map(t=>{const l=L(t.lid);const st=t.dry?T('Quridi'):t.stage>=5?T('Meva soldi'):T(['','Nihol ekildi','Unib chiqdi','Nihol boʻldi','Daraxt boʻldi'][t.stage]||'Oʻsmoqda');
   let act='';
   if(t.dry)act=`<button class="btn blue" onclick="startReview('water','${t.lid}')">${IC.drop.replace('<svg','<svg width="16" height="16"')} ${T('Sugʻorish')}</button>`;
   else if(t.stage>=5)act=t.water.can?`<button class="btn blue" onclick="startReview('water','${t.lid}')">${IC.drop.replace('<svg','<svg width="16" height="16"')} +${C.waterFruit} 🍎</button>`:`<button class="btn off">${T('Bugun sugʻorildi')}</button>`;
   else act=`<div class="muted" style="font-size:12px;padding:10px 0">${T('Oʻsmoqda')} ${t.stage}/5</div>`;
   return `<div class="tree ${t.dry?'dry':''}"><span class="lt ar">${esc(l.letter||'')}</span>${t.stage>=5&&!t.dry?`<span class="badge">🍎 ${t.fruit}</span>`:t.dry&&t.fruit?`<span class="badge">🍎 ${t.fruit}</span>`:''}${treeSvg(t.stage,t.fruit,t.dry)}<div class="st">${st}</div>${act}</div>`;}).join('')}</div>`;
 h+=`<div class="card" style="margin-top:14px;font-size:14px"><b>${T('Qanday ishlaydi?')}</b><p class="muted" style="margin:6px 0 0;line-height:1.5">1-qism — nihol ekiladi, 2 — unib chiqadi, 3 — nihol boʻladi, 4 — daraxt, 5 — ${C.fruitStart||3} ta meva. Bitta daraxtdan keyin ${C.witherAfter} ta yangi daraxt meva solsa, u quriydi — ${C.waterQ} savollik takrorlash bilan sugʻoring. Sugʻorish meva sonini ham koʻpaytiradi. 1 meva = ${C.fruitPrice} dinor.</p></div>`;
 return h+`</div>`;}
async function sellFruit(){try{const r=await api('sell');hap('ok');beep(1);toast(`+${r.gain} dinor 🪙`);ME.prog.dinor=r.dinor;ME.garden=r.garden;render();}catch(e){toast(e.message);}}

/* ---------- Profil ---------- */
const DAYS={Du:[1,'Dushanba','Пн'],Se:[2,'Seshanba','Вт'],Ch:[3,'Chorshanba','Ср'],Cho:[3,'Chorshanba','Ср'],Pa:[4,'Payshanba','Чт'],Ju:[5,'Juma','Пт'],Sh:[6,'Shanba','Сб'],Sha:[6,'Shanba','Сб'],Ya:[0,'Yakshanba','Вс']};
function nextLesson(g){const days=(Array.isArray(g.days)?g.days:String(g.days||'').split(/[\s,]+/)).map(d=>DAYS[d]).filter(Boolean);if(!days.length||!g.time)return '';
 const now=new Date(Date.now()+5*3600e3);const [hh,mm]=g.time.split(':').map(Number);
 for(let k=0;k<8;k++){const d=new Date(now.getTime()+k*864e5);const wd=d.getUTCDay();if(!days.some(x=>x[0]===wd))continue;
  if(k===0&&(now.getUTCHours()*60+now.getUTCMinutes())>hh*60+mm+(+g.dur||90))continue;
  const day=days.find(x=>x[0]===wd);return `${k===0?T('bugun'):k===1?T('ertaga'):(LANG==='ru'?day[2]:day[1])}, ${g.time}`;}
 return '';}
function profileView(){
 if(SUB==='market')return marketView();if(SUB==='orders')return ordersView();
 const u=ME.user,p=ME.prog,G=ME.garden,g=u.group;
 let h=`<div class="wrap"><div class="phead"><div class="av lg" style="background:${avCol(u.name)}">${esc(ini(u.name))}</div><div class="grow"><h2 class="tt" style="margin:0">${esc(u.name)}</h2>
  <div class="muted" style="font-size:13px;margin-top:4px">${T('ID')}: <span class="code nt">${esc(u.code)}</span>${g?` · ${esc(g.name)}`:''}</div></div></div>
  <div class="sgrid"><div class="sg">${IC.flame}<div><b>${p.days}</b><span>${T('Faol kun')}${p.streak>1?` · 🔥${p.streak}`:''}</span></div></div>
   <div class="sg">${IC.coin}<div><b>${fmt(p.dinor)}</b><span>${T('Dinor')}</span></div></div>
   <div class="sg"><span style="color:var(--blue)">${IC.book}</span><div><b>${p.lessons}</b><span>${T('Dars')}</span></div></div>
   <div class="sg">${IC.tree}<div><b>${G.count} · ${G.fruit}🍎</b><span>${T('Daraxt')} · ${T('Meva')}</span></div></div></div>`;
 if(g){const nx=nextLesson(g);h+=`<div class="live"><div class="row"><div class="grow"><div style="font-size:12.5px;opacity:.9;text-transform:uppercase;letter-spacing:.5px">${T('Jonli dars')}</div><h4>${esc(g.name)}</h4>
   <div style="font-size:14px;opacity:.95">${nx?`${T('Keyingi dars')}: <b>${esc(nx)}</b>`:esc((Array.isArray(g.days)?g.days.join(', '):g.days)+(g.time?' · '+g.time:''))}</div>${g.note?`<div style="font-size:13px;opacity:.85;margin-top:4px">${esc(g.note)}</div>`:''}</div><div style="width:46px;height:46px">${IC.video}</div></div>
   ${g.meet?`<button class="btn" onclick="openLink('${esc(g.meet)}')">${T('Darsga qatnashish')}</button>`:`<div style="margin-top:10px;font-size:13px;opacity:.85">${T('Havola hali qoʻshilmagan')}</div>`}</div>`;}
 h+=`<div class="list"><button class="li" onclick="openSub('market')"><span class="ico" style="background:var(--coral)">${IC.cart}</span><span class="t">${T('Market')}<small>${T('Dinorga sovgʻalar')}</small></span>${IC.chev.replace('<svg','<svg class="chev"')}</button>
  <button class="li" onclick="openSub('orders')"><span class="ico" style="background:var(--purple)">${IC.box}</span><span class="t">${T('Buyurtmalarim')}</span>${IC.chev.replace('<svg','<svg class="chev"')}</button></div>
  <div class="list"><div class="li" style="flex-wrap:wrap"><span class="ico" style="background:var(--blue)">${IC.globe}</span><span class="t">${T('Til')}</span>
   <div class="seg nt" style="width:100%;margin-top:4px">${[['uz','Lotin'],['cy','Кирилл'],['ru','Русский']].map(([k,n])=>`<button class="${LANG===k?'on':''}" onclick="setLang('${k}')">${n}</button>`).join('')}</div></div>
   <button class="li" onclick="setDark()"><span class="ico" style="background:#334155">${IC.moon}</span><span class="t">${T('Tungi rejim')}</span><span class="tg ${p.dark?'on':''}"></span></button>
   ${ME.cfg.support?`<button class="li" onclick="openLink('${esc(ME.cfg.support)}')"><span class="ico" style="background:var(--ok)">${IC.chat}</span><span class="t">${T('Murojaat')}</span>${IC.chev.replace('<svg','<svg class="chev"')}</button>`:''}</div>`;
 return h+`</div>`;}
function openLink(u){u=String(u||'');if(/^@/.test(u))u='https://t.me/'+u.slice(1);try{if(/^https:\/\/t\.me\//.test(u)&&TG&&TG.openTelegramLink){TG.openTelegramLink(u);return;}if(TG&&TG.openLink){TG.openLink(u);return;}}catch(e){}window.open(u,'_blank');}
async function setLang(l){LANG=l;ME.prog.lang=l;render();try{await api('settings',{lang:l});}catch(e){}}
async function setDark(){ME.prog.dark=!ME.prog.dark;theme();render();try{await api('settings',{dark:ME.prog.dark});}catch(e){}}
function openSub(s){SUB=s;render();window.scrollTo(0,0);if(s==='market')loadMarket();if(s==='orders')loadOrders();}
async function loadMarket(){try{MARKET=await api('market');if(SUB==='market')render();}catch(e){toast(e.message);}}
async function loadOrders(){try{ORDERS=await api('orders');if(SUB==='orders')render();}catch(e){toast(e.message);}}
const backH=()=>`<button class="back" onclick="SUB=null;render()">${IC.back}${T('Orqaga')}</button>`;
function marketView(){let h=`<div class="wrap">${backH()}<h2 class="tt">${T('Market')}</h2><p class="sub">${IC.coin.replace('<svg','<svg width="16" height="16" style="vertical-align:-3px"')} ${fmt(ME.prog.dinor)} ${T('Dinor')}</p>`;
 if(!MARKET)return h+`<div class="center" style="min-height:40vh"><div class="spin"></div></div></div>`;
 if(!MARKET.items.length)return h+`<div class="empty"><div class="em">🛍️</div><p>${T('Mahsulotlar hali yoʻq')}</p></div></div>`;
 return h+`<div class="mgrid">${MARKET.items.map(x=>`<button class="prod" onclick="prodSheet('${x.id}')"><div class="im" style="${x.img?`background-image:url('${esc(x.img)}')`:''}">${x.img?'':'🎁'}</div><div class="pi"><div class="pn">${esc(x.name)}</div><div class="price">${IC.coin}${fmt(x.price)}</div>${x.stock===0?`<div class="muted" style="font-size:12px">${T('Tugagan')}</div>`:''}</div></button>`).join('')}</div></div>`;}
function prodSheet(id){const x=MARKET.items.find(i=>i.id===id);if(!x)return;const can=ME.prog.dinor>=x.price&&x.stock!==0;
 openSheet(`${x.img?`<img src="${esc(x.img)}" alt="" style="width:100%;max-height:260px;object-fit:cover;border-radius:18px;border:2px solid var(--line)">`:''}<h3 style="margin-top:12px">${esc(x.name)}</h3>
  <div class="price" style="font-size:20px;margin-bottom:8px">${IC.coin}${fmt(x.price)}</div>${x.desc?`<p style="white-space:pre-line;line-height:1.5;margin:0 0 14px" class="muted">${esc(x.desc)}</p>`:''}
  ${x.stock!=null?`<p class="muted" style="font-size:13px">${x.stock>0?`${T('Mavjud')}: ${x.stock} ${T('dona')}`:T('Tugagan')}</p>`:''}
  <div id="buyBox">${can?`<button class="btn ok" onclick="buyStep('${x.id}')">${T('Sotib olish')}</button>`:`<button class="btn off">${x.stock===0?T('Tugagan'):T('Dinor yetarli emas')}</button>`}</div>`);}
function buyStep(id){const ph=ME.user.phone||'';$('buyBox').innerHTML=`<label class="muted" style="font-size:13px">${T('Telefon raqamingiz')}</label><input class="inp" id="bph" type="tel" inputmode="tel" value="${esc(ph)}" placeholder="+998 90 123 45 67" style="margin:6px 0 10px">
  <p class="muted" style="font-size:13px;margin:0 0 12px">${T('Operator siz bilan bogʻlanib, yetkazib berishni kelishadi.')}</p><button class="btn ok" id="bgo" onclick="buy('${id}')">${T('Tasdiqlash')}</button>`;cyrDom($('buyBox'));}
async function buy(id){const b=$('bgo');b.disabled=true;try{const r=await api('buy',{pid:id,phone:$('bph').value});ME.prog.dinor=r.dinor;hap('ok');beep(1);
  $('sheetIn').innerHTML=`<div class="grab"></div><div class="res"><div class="em pop">🎉</div><h2>${T('Buyurtma qabul qilindi!')}</h2><p class="muted">${T('Operator siz bilan bogʻlanib, yetkazib berishni kelishadi.')}</p></div><button class="btn" onclick="closeSheet();openSub('orders')">${T('Buyurtmalarim')}</button>`;cyrDom($('sheetIn'));MARKET=null;loadMarket();}
 catch(e){b.disabled=false;toast(e.message);}}
const OST={new:['Yangi','#2F8CFF'],called:['Qoʻngʻiroq qilindi','#9B5CF6'],delivered:['Yetkazildi','#2EC45E'],cancelled:['Bekor qilindi','#8C7B58'],refunded:['Pul qaytarildi','#FF7A45'],refund:['Pul qaytarildi','#FF7A45']};
function ordersView(){let h=`<div class="wrap">${backH()}<h2 class="tt">${T('Buyurtmalarim')}</h2>`;
 if(!ORDERS)return h+`<div class="center" style="min-height:40vh"><div class="spin"></div></div></div>`;
 if(!ORDERS.items.length)return h+`<div class="empty"><div class="em">📦</div><p>${T('Buyurtmalar yoʻq')}</p></div></div>`;
 return h+`<div class="list">${ORDERS.items.map(o=>{const s=OST[o.status]||[o.status,'#8C7B58'];return `<div class="ord"><div class="grow"><b>${esc(o.productName)}</b><div class="muted" style="font-size:12.5px">${esc(String(o.at).slice(0,10).split('-').reverse().join('.'))} · ${fmt(o.price)} dinor</div></div><span class="st" style="background:${s[1]}22;color:${s[1]}">${T(s[0])}</span></div>`;}).join('')}</div></div>`;}

boot();
</script>
